# Runs the tracker on GitHub's computers and publishes the dashboard.
#
#   every day ~7am US Central   scrape new filings, email watchlist alerts, rebuild the site
#   Sundays                     also run the backtest and send the weekly email
#   "Run workflow" button       same as daily; tick "backfill" to fill history
#
# Settings it needs (repo Settings > Secrets and variables > Actions):
#   SEC_CONTACT_EMAIL   required by sec.gov (any email you read)
#   SMTP_USER, SMTP_PASSWORD, EMAIL_TO   optional, for emails (see mailer.py)
#   WATCHLIST           optional, e.g. "VTI MSFT COST" -- kept private, never on the site
# And Settings > Pages > Source: "GitHub Actions".
#
# The database is kept between runs in the Actions cache (no size worries in
# git). If the cache is ever lost, the next run starts over and the
# scrapers refill it.

name: tracker
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Fill history (first run; slow, resumable)"
        type: boolean
        default: false
      weekly:
        description: "Also run the backtest and send the weekly email"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"  # log lines appear as they happen, with real timestamps
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      WATCHLIST: ${{ secrets.WATCHLIST }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore database
        id: db
        uses: actions/cache/restore@v4
        with:
          path: congress_trades.duckdb
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Backfill history
        if: inputs.backfill || steps.db.outputs.cache-matched-key == ''
        # stop after ~4.5h so the database still gets saved; the next run resumes
        run: timeout 270m python backfill.py || echo "backfill paused; resumes next run"

      - name: Daily update
        continue-on-error: true  # one government site being down shouldn't skip the dashboard
        run: timeout 60m python daily.py

      - name: Lookup data for any stock, ETF or mutual fund
        # symbols daily, SEC financials weekly, then Yahoo prices until the
        # budget runs out (the first fill takes a few days, then it's a top-up).
        # Skipped on backfill runs, which already use most of the job's time.
        if: ${{ !inputs.backfill && steps.db.outputs.cache-matched-key != '' }}
        continue-on-error: true
        run: timeout 50m python lookup.py --minutes 40

      - name: Is it Sunday?
        id: day
        run: echo "sunday=$([ "$(date -u +%u)" = 7 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Weekly backtest and email
        if: steps.day.outputs.sunday == 'true' || inputs.weekly
        continue-on-error: true  # a failed email mustn't stop the site from rebuilding
        run: |
          timeout 60m python backtest.py || echo "backtest failed; keeping last week's"
          timeout 30m python leaders.py || echo "leaderboard failed; keeping last week's"
          python weekly.py

      - name: Build dashboard
        run: python dashboard.py

      - name: Headlines (a starting copy; news.yml refreshes them hourly)
        continue-on-error: true
        run: timeout 10m python headlines.py site/tracked.json site/news.json

      - name: Add the investing course
        run: mkdir -p site/course && cp course/* site/course/

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: congress_trades.duckdb
          key: db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
