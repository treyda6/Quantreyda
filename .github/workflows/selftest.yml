name: selftest
on: [push, pull_request]
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python selftest.py
      # unused imports and undefined names; DuckDB reads DataFrames by
      # variable name, so "df assigned but never used" is expected
      - run: pip install pyflakes && ! python -m pyflakes *.py | grep -v "f-string is missing placeholders\|'df' is assigned"
