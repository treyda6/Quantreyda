/* ---------------- 1.1 ---------------- */
{
  id: "1-1", phase: 1, num: "1.1", title: "Your money foundation",
  lede: "Before anyone picks a single stock, an advisor checks the base: cash flow, an emergency fund, and debt. Investing on a weak base is how people end up selling at the worst time.",
  minutes: 15,
  body: `
<h2>Why advisors start here</h2>
<p>When a new client sits down at a branch, the first meeting is rarely about stocks. It's about where their money goes each month, what could knock them off course, and what they're saving for. Investments only work if you can leave them alone through bad years. A person with no cash cushion and a credit card balance at 24% will be forced to sell when life happens.</p>

<h2>Step 1: Know your cash flow</h2>
<p>Cash flow is simply income minus spending. You can't invest money you don't consistently have left over. A simple framework many advisors use is the <strong>50/30/20 split</strong> of take-home pay:</p>
<ul>
  <li><strong>50% needs:</strong> housing, utilities, groceries, insurance, minimum debt payments.</li>
  <li><strong>30% wants:</strong> dining out, travel, hobbies.</li>
  <li><strong>20% savings and extra debt payoff.</strong></li>
</ul>
<p>It's a starting point, not a rule. Someone in a high-cost city may run 60/20/20. The point is to know your numbers.</p>

<h2>Step 2: The emergency fund</h2>
<p>An emergency fund is cash set aside for job loss, car repairs, or medical bills. The standard target is <strong>3 to 6 months of essential expenses</strong>, held somewhere safe and easy to reach, like a high-yield savings account or money market fund. Not in stocks.</p>
<div class="key"><b>Key idea</b>The emergency fund is what lets your investments stay invested. It's insurance for your portfolio, not a missed opportunity.</div>
<p>Use 3 months if your income is stable and you have two earners. Use 6 or more if you're self-employed, your income swings, or you're the sole earner.</p>

<h2>Step 3: The order of operations</h2>
<p>Here's the priority list most planners use. Work down it in order:</p>
<ol>
  <li><strong>Starter emergency fund</strong> of about $1,000 to $2,000.</li>
  <li><strong>Get any employer 401(k) match.</strong> A 50% or 100% match is an instant return no investment can beat.</li>
  <li><strong>Pay off high-interest debt</strong>, roughly anything above 8%. Paying off a 24% credit card is a guaranteed 24% return.</li>
  <li><strong>Build the full emergency fund</strong> to 3 to 6 months.</li>
  <li><strong>Fund a Roth IRA</strong> (Lesson 1.3 explains why).</li>
  <li><strong>Raise workplace retirement savings</strong> toward 15% of income.</li>
  <li><strong>Taxable investing and extra goals</strong>, like a house fund or paying down low-rate debt early.</li>
</ol>
<div class="example"><b class="t">Example</b>Maria has $8,000 on a card at 22%, a 401(k) with a 4% match she isn't taking, and $500 in savings. Her advisor's plan: raise savings to $1,500, contribute 4% to get the full match, then throw every extra dollar at the card. Investing in a Roth before the card is gone would mean hoping for 22% returns just to break even.</div>

<h2>Step 4: Time horizon and risk</h2>
<p><strong>Time horizon</strong> is how long until you need the money. It's the single most important input in choosing investments:</p>
<div class="tbl"><table>
  <thead><tr><th>When you need it</th><th>Where it belongs</th><th>Why</th></tr></thead>
  <tbody>
    <tr><td class="n">Under 2 years</td><td>Cash, savings, CDs, Treasury bills</td><td>Stocks can fall 30% or more in a year and take years to recover.</td></tr>
    <tr><td class="n">2 to 7 years</td><td>Mix of bonds and some stocks</td><td>Some growth, but limited damage if markets drop right before you need it.</td></tr>
    <tr><td class="n">7+ years</td><td>Mostly stocks</td><td>Over long periods, stocks have historically beaten everything else.</td></tr>
  </tbody>
</table></div>
<p><strong>Risk tolerance</strong> has two parts. <em>Risk capacity</em> is how much loss you can afford (based on income, savings, and horizon). <em>Risk willingness</em> is how much loss you can stomach without panicking. Advisors are required by FINRA's know-your-customer and suitability rules to gather both before recommending anything. A Roth IRA you won't touch for 25+ years has high capacity, even if your willingness needs work.</p>`,
  exercise: `<p>Write a one-page <strong>client profile</strong> for yourself, the same way an advisor would fill one out at a first meeting:</p>
<ol>
  <li>Monthly take-home income and your three biggest expense categories.</li>
  <li>Every debt with its balance and interest rate.</li>
  <li>Your emergency fund in months of expenses (cash ÷ monthly essentials).</li>
  <li>Three goals, each with a dollar amount and a date.</li>
  <li>Where you are on the 7-step order of operations, and your next step.</li>
</ol>`,
  quiz: [
    { q: "Which should come first for most people?", o: ["Opening a brokerage account for stock picks", "Capturing the full employer 401(k) match", "Paying off a 4% car loan early", "Buying a rental property"], a: 1, why: "An employer match is an immediate 50% to 100% return on that money. Nothing else on the list comes close." },
    { q: "A typical emergency fund target is:", o: ["One week of income", "3 to 6 months of essential expenses", "One year of total income, invested in stocks", "Whatever is left at the end of the month"], a: 1, why: "3 to 6 months of essentials, kept in cash or near-cash, covers most job losses and big surprise bills." },
    { q: "You'll need $20,000 for a house down payment in 18 months. The best place for it is:", o: ["An S&P 500 index fund", "A few high-growth stocks", "A high-yield savings account or Treasury bills", "A 30-year bond fund"], a: 2, why: "With a short horizon you can't wait out a market drop. Long-term bond funds can also fall when rates rise." },
    { q: "Why does paying off a 22% credit card count as an investment?", o: ["It raises your credit score, which pays interest", "Every dollar paid avoids 22% interest, a guaranteed return", "It doesn't, investing always beats paying debt", "Credit card interest is tax-deductible"], a: 1, why: "Avoiding a 22% cost is the same as earning 22%, with zero risk. No stock reliably earns that." },

  ],

/* ---------------- 1.2 ---------------- */
{
  id: "1-2", phase: 1, num: "1.2", title: "Compounding and the cost of waiting",
  lede: "Compounding is earning returns on your past returns. It's slow at first and then very fast, which is why time in the market matters more than almost anything else.",
  minutes: 12,
  body: `
<h2>Simple vs compound growth</h2>
<p>With <strong>simple</strong> interest you earn only on your original money. Put $10,000 in at 8% simple interest and you earn $800 every year. After 30 years you have $34,000.</p>
<p>With <strong>compound</strong> growth, each year's gain is added to the pile and earns returns too. The same $10,000 at 8% compounded becomes about <strong>$100,600</strong> in 30 years. Same money, same rate, three times the result.</p>
<p class="formula">Future value = Present value × (1 + rate)<sup>years</sup></p>
<p>$10,000 × 1.08<sup>30</sup> = $10,000 × 10.06 ≈ $100,600.</p>

<h2>The Rule of 72</h2>
<p>A quick mental shortcut: divide 72 by the annual return to get the years it takes money to double.</p>
<div class="tbl"><table>
  <thead><tr><th>Annual return</th><th>Years to double</th><th>$10,000 after 36 years</th></tr></thead>
  <tbody>
    <tr><td class="n">2%</td><td class="n">36</td><td class="n">≈ $20,000</td></tr>
    <tr><td class="n">6%</td><td class="n">12</td><td class="n">≈ $80,000</td></tr>
    <tr><td class="n">8%</td><td class="n">9</td><td class="n">≈ $160,000</td></tr>
    <tr><td class="n">12%</td><td class="n">6</td><td class="n">≈ $640,000</td></tr>
  </tbody>
</table></div>
<p>Small differences in return turn into huge differences over decades. This is also why <strong>fees matter</strong>: a 1% annual fee can easily take a quarter or more of your ending balance over 30 years.</p>

<h2>Try it: the compounding calculator</h2>
<p>Change the numbers to see what regular Roth contributions can grow into. The return is an assumption, not a promise. U.S. stocks have averaged roughly 10% a year over the last century before inflation, with many losing years along the way. Planners often use 6% to 8% to stay conservative.</p>
<div class="calc" id="calc">
  <div class="calc-in">
    <label for="cStart">Starting balance ($)<input id="cStart" type="number" min="0" step="100" value="5000"></label>
    <label for="cMonthly">Monthly contribution ($)<input id="cMonthly" type="number" min="0" step="25" value="500"></label>
    <label for="cRate">Annual return (%)<input id="cRate" type="number" min="0" max="20" step="0.5" value="7"></label>
    <label for="cYears">Years<input id="cYears" type="number" min="1" max="60" step="1" value="30"></label>
  </div>
  <div class="calc-out">
    <div class="big">Ending balance<b id="oEnd">$0</b></div>
    <div>You put in<b id="oIn">$0</b></div>
    <div>Growth earned<b id="oGrowth">$0</b></div>
  </div>
</div>

<h2>The cost of waiting</h2>
<div class="example"><b class="t">Example</b>Two investors each put $500 a month into a Roth IRA earning 7%. Alex starts at 25 and stops at 35, investing $60,000 total. Jordan starts at 35 and keeps going until 65, investing $180,000. At 65, Alex has about <strong>$700,000</strong> and Jordan has about <strong>$610,000</strong>. Alex invested one third as much money and still ended up ahead, purely from starting ten years earlier.</div>
<div class="key"><b>Key idea</b>The three levers of compounding are how much you put in, the return you earn, and time. Time is the one you can't get back, and fees quietly pull on the return lever every year.</div>

<h2>Inflation: the other compounding</h2>
<p>Inflation compounds against you. At 3% inflation, prices double in about 24 years (72 ÷ 3). So a "real" return is your return minus inflation. A 7% return with 3% inflation grows your buying power about 4% a year. Cash in a 0.5% savings account loses buying power every year, which is why long-term money needs to be invested.</p>`,
  exercise: `<ol>
  <li>Use the calculator with your actual Roth balance and what you can contribute monthly. Record the 30-year result at 6%, 8%, and 10%.</li>
  <li>Run it again with 1% less return to see what a 1% annual fee would cost you over 30 years. Write that dollar figure down.</li>
  <li>Look up the expense ratio of every fund in your Roth (search the ticker plus "expense ratio"). Note any above 0.50%.</li>
</ol>`,

    { q: "You earn 6% while inflation runs 3.5%. Your real return is about:", o: ["9.5%", "6%", "2.5%", "-3.5%"], a: 2, why: "Real return ≈ nominal return minus inflation: 6% − 3.5% = 2.5%." },
    { q: "A fund charges 1% a year instead of 0.05%. Over 30 years the extra fee mostly hurts by:", o: ["A one-time charge of 1%", "Reducing the return that compounds every single year", "Raising your taxes", "Nothing, fees are small"], a: 1, why: "The fee comes out of every year's return, so it compounds against you and can consume a large share of the ending balance." }
  ],
  deeper: `SEC's free <a href="https://www.investor.gov/financial-tools-calculators/calculators/compound-interest-calculator" target="_blank" rel="noopener">compound interest calculator</a>; <em>The Little Book of Common Sense Investing</em> by John Bogle, chapters on costs.`

{
  id: "1-3", phase: 1, num: "1.3", title: "Retirement accounts: Roth, traditional, 401(k)",
  lede: "The account you invest in can matter as much as what you buy. These rules are core material on the SIE and Series 66, and they're the questions clients ask advisors most.",
  minutes: 18,
  body: `
<h2>The big idea: when do you pay tax?</h2>
<p>Retirement accounts are tax wrappers. The investments inside can be the same; the difference is when the IRS takes its share.</p>
<div class="tbl"><table>
  <thead><tr><th></th><th>Traditional (IRA or 401k)</th><th>Roth (IRA or 401k)</th></tr></thead>
  <tbody>
    <tr><td><strong>Going in</strong></td><td>Tax-deductible (pre-tax)</td><td>After-tax, no deduction</td></tr>
    <tr><td><strong>While invested</strong></td><td>Grows tax-deferred</td><td>Grows tax-free</td></tr>
    <tr><td><strong>Coming out</strong></td><td>Taxed as ordinary income</td><td>Tax-free if qualified</td></tr>
    <tr><td><strong>Best if</strong></td><td>Your tax rate is higher now than it will be in retirement</td><td>Your tax rate is lower now, or you're young with decades of growth ahead</td></tr>
  </tbody>
</table></div>
<div class="key"><b>Key idea</b>Traditional means pay tax later. Roth means pay tax now and never again on that money. For a long-term stock picker, Roth is powerful because a big winner can grow for decades and come out tax-free.</div>

<h2>Roth IRA rules you need cold</h2>
<ul>
  <li><strong>Contribution limit for 2026:</strong> $7,500 per year if under 50, plus a $1,100 catch-up at 50 and older. Check IRS.gov each year since these rise with inflation.</li>
  <li><strong>Earned income required:</strong> you can only contribute up to what you earned from work that year. Investment income doesn't count.</li>
  <li><strong>Income limits:</strong> the ability to contribute phases out at higher incomes. For 2026 it's roughly $153,000 to $168,000 for single filers and $242,000 to $252,000 for married filing jointly. Above that, people use a "backdoor Roth" (contribute to a traditional IRA, then convert).</li>
  <li><strong>Deadline:</strong> you can contribute for a tax year until the tax filing deadline the next April.</li>
  <li><strong>Contributions come out anytime</strong> tax- and penalty-free, because you already paid tax on them.</li>
  <li><strong>Earnings</strong> come out tax-free only when <em>qualified</em>: you're at least 59½ and it's been 5 years since your first Roth contribution. Otherwise earnings withdrawn early may face income tax plus a 10% penalty, with some exceptions (first home up to $10,000, disability, death).</li>
  <li><strong>No required minimum distributions</strong> for the original owner. Your money can keep growing for life.</li>
</ul>
<div class="example"><b class="t">Example</b>You've contributed $20,000 to your Roth over the years and it's now worth $32,000. At age 40 you could withdraw up to $20,000 with no tax or penalty. The $12,000 of growth stays locked behind the age 59½ and 5-year rules.</div>

<h2>Traditional IRA basics</h2>
<ul>
  <li>Same contribution limit as the Roth, and it's a combined limit: $7,500 total across both, not each.</li>
  <li>The deduction phases out at certain incomes if you or your spouse have a workplace plan.</li>
  <li>Withdrawals before 59½ generally face income tax plus a 10% penalty.</li>
  <li><strong>Required minimum distributions (RMDs)</strong> start at age 73 (75 for people born in 1960 or later). The IRS wants its deferred tax eventually.</li>
</ul>

<h2>Workplace plans: 401(k), 403(b), and for business owners</h2>
<ul>
  <li><strong>401(k):</strong> offered by employers, with a much higher limit ($24,500 for employees in 2026, plus catch-up at 50+). Many offer both traditional and Roth versions.</li>
  <li><strong>403(b):</strong> the nonprofit and school version of a 401(k).</li>
  <li><strong>SEP IRA:</strong> for self-employed people and small businesses. Employer-only contributions up to 25% of pay, with a high dollar cap. Simple to set up.</li>
  <li><strong>Solo 401(k):</strong> for a business owner with no employees besides a spouse. Lets you contribute as both employee and employer, often the highest-limit option.</li>
  <li><strong>SIMPLE IRA:</strong> for small businesses with up to 100 employees. Lower limits, required employer contribution.</li>
</ul>
<p>Advisors at branches like Edward Jones spend a lot of time setting up SEP, SIMPLE, and Solo 401(k) plans for local business owners. Knowing which fits which business is a real skill.</p>

<h2>Rollovers</h2>
<p>When someone leaves a job, they can move their 401(k) into an IRA through a <strong>direct rollover</strong> (trustee to trustee, no tax). In an <strong>indirect rollover</strong> the check comes to you, 20% is withheld for taxes, and you have 60 days to deposit the full amount or it counts as a withdrawal. Rollovers are a huge part of an advisor's business, and regulators watch them closely because of the conflict of interest in recommending one.</p>`,
  exercise: `<ol>
  <li>Log into your Roth IRA and find your total contributions to date versus current value. The difference is your earnings.</li>
  <li>Write down the year of your first Roth contribution. That starts your 5-year clock.</li>
  <li>If you own a business, write two sentences on whether a SEP IRA or Solo 401(k) would let you save more than a Roth alone, and why.</li>
  <li>Explain in plain words, as if to a client, why stock picking inside a Roth is tax-efficient and what you give up (you can't deduct losses).</li>
</ol>`,
  quiz: [
    { q: "Which can you withdraw from a Roth IRA at any age with no tax or penalty?", o: ["All earnings", "Your original contributions", "Nothing until 59½", "Only dividends"], a: 1, why: "Contributions were made with after-tax money, so they can come out anytime. Earnings need the 59½ and 5-year rules." },
    { q: "In 2026, a 30-year-old puts $5,000 into a traditional IRA. How much more can they put into a Roth IRA that year?", o: ["$7,500", "$2,500", "$0", "$5,000"], a: 1, why: "The IRA limit is shared across traditional and Roth: $7,500 − $5,000 = $2,500." },
    { q: "Roth IRAs are especially attractive for young investors mainly because:", o: ["They have higher contribution limits", "Decades of growth come out tax-free, and their tax rate is often low now", "They allow day trading", "They are FDIC insured"], a: 1, why: "Paying tax at today's lower rate, then never paying tax on decades of growth, is the core Roth advantage." },
    { q: "In an indirect 401(k) rollover, how long do you have to redeposit the money?", o: ["10 days", "30 days", "60 days", "One year"], a: 2, why: "60 days. Miss it and the amount is treated as a taxable distribution, possibly with a 10% penalty." },
    { q: "Which is true about required minimum distributions (RMDs)?", o: ["Roth IRA owners must take them at 73", "Traditional IRA owners must start them in their 70s", "They apply to all accounts at 59½", "They only apply to 529 plans"], a: 1, why: "Traditional IRAs require RMDs starting at 73 (75 for those born 1960 or later). Original Roth IRA owners have none." }
  ],
  deeper: `IRS <a href="https://www.irs.gov/retirement-plans" target="_blank" rel="noopener">Retirement Plans</a> pages and Publication 590-A and 590-B; the <a href="https://www.bogleheads.org/wiki/Roth_IRA" target="_blank" rel="noopener">Bogleheads wiki on Roth IRAs</a>.`
},

{
  id: "1-4", phase: 1, num: "1.4", title: "Taxes on investments",
  lede: "Outside a retirement account, taxes are one of the biggest drags on returns. Advisors add real value just by managing them well.",
  minutes: 14,
  body: `
<h2>Capital gains</h2>
<p>A <strong>capital gain</strong> is profit from selling something for more than you paid. What you paid (plus commissions) is your <strong>cost basis</strong>. You only owe tax when you sell; an unsold gain is "unrealized."</p>
<div class="tbl"><table>
  <thead><tr><th>Type</th><th>Held</th><th>Federal tax rate</th></tr></thead>
  <tbody>
    <tr><td>Short-term gain</td><td class="n">1 year or less</td><td>Your ordinary income rate (10% to 37%)</td></tr>
    <tr><td>Long-term gain</td><td class="n">More than 1 year</td><td>0%, 15%, or 20% depending on income</td></tr>
  </tbody>
</table></div>
<p>Most middle-income investors pay 15% on long-term gains. High earners may also owe the 3.8% net investment income tax. Holding a winner for one year and one day instead of 11 months can nearly halve the tax.</p>

<h2>Dividends and interest</h2>
<ul>
  <li><strong>Qualified dividends</strong> (most from U.S. companies held long enough) get the same low long-term rates.</li>
  <li><strong>Ordinary (non-qualified) dividends</strong> and most <strong>bond interest</strong> are taxed as regular income.</li>
  <li><strong>Municipal bond interest</strong> is generally free from federal tax, and often state tax if you live in the issuing state. That's why high earners buy munis, a common Series 7 topic.</li>
</ul>

<h2>Capital losses and tax-loss harvesting</h2>
<p>Losses offset gains. If losses exceed gains, you can deduct up to <strong>$3,000</strong> a year against ordinary income and carry the rest forward forever. <strong>Tax-loss harvesting</strong> means selling a loser on purpose to lock in that deduction, then buying something similar to stay invested.</p>
<p>The trap is the <strong>wash sale rule</strong>: if you buy the same or a "substantially identical" security within 30 days before or after the sale, the loss is disallowed (it gets added to the new shares' basis instead).</p>
<div class="example"><b class="t">Example</b>You sell a stock at a $4,000 loss on March 1 and have $1,500 of gains this year. The loss wipes out the $1,500 gain, deducts $2,500 against your income, and nothing carries forward. But if you buy the same stock back on March 20, the wash sale rule blocks the loss.</div>

<h2>Why this matters for your Roth</h2>
<p>Inside a Roth IRA, none of this applies. No capital gains tax, no dividend tax, no need to wait a year before selling. That makes a Roth a great home for active stock picks and high-turnover strategies. The flip side: losses inside a Roth can't be deducted, and the wash sale rule can still bite if you sell at a loss in a taxable account and rebuy the same stock in your IRA.</p>
<div class="key"><b>Key idea</b>Asset location means putting tax-inefficient investments (bonds, REITs, frequently traded stocks) in tax-advantaged accounts, and tax-efficient ones (broad index funds held for years) in taxable accounts.</div>`,
  exercise: `<ol>
  <li>For any taxable brokerage account you have, list each holding with its purchase date, cost basis, and current value. Mark which would be short-term versus long-term gains.</li>
  <li>Pretend you need to raise $5,000 in cash. Which shares would you sell to owe the least tax? Write out your reasoning.</li>
  <li>If you have no taxable account, do the same exercise with three made-up positions.</li>
</ol>`,
  quiz: [
    { q: "You bought a stock 8 months ago and sell it for a $2,000 gain. How is it taxed?", o: ["Not taxed until retirement", "At long-term rates (0/15/20%)", "As ordinary income (short-term)", "At a flat 10%"], a: 2, why: "Held one year or less, so it's a short-term gain taxed at your ordinary income rate." },
    { q: "The wash sale rule disallows a loss if you rebuy the same security within:", o: ["7 days", "30 days before or after the sale", "90 days", "One year"], a: 1, why: "The window is 30 days before or after the sale, a 61-day period in total." },
    { q: "How much of a net capital loss can you deduct against ordinary income each year?", o: ["$1,000", "$3,000", "$10,000", "Unlimited"], a: 1, why: "$3,000 per year, with the remainder carried forward indefinitely." },
    { q: "Which investment's income is typically free of federal income tax?", o: ["Corporate bond interest", "Municipal bond interest", "Treasury bond interest", "REIT dividends"], a: 1, why: "Municipal bond interest is generally federally tax-exempt. Treasuries are the reverse: federally taxed, but state tax-exempt." }
  ],
  deeper: `IRS <a href="https://www.irs.gov/taxtopics/tc409" target="_blank" rel="noopener">Topic 409, capital gains and losses</a>; IRS Publication 550, Investment Income and Expenses.`
},

{
  id: "1-5", phase: 1, num: "1.5", title: "What you can own: stocks, bonds, funds",
  lede: "Every portfolio is built from a handful of building blocks. Know what each one is, how it makes money, and how it can lose money.",
  minutes: 18,
  body: `
<h2>Stocks (equities)</h2>
<p>A share of stock is a slice of ownership in a company. You make money two ways: the share price rises as the business grows (capital appreciation), and the company may pay part of its profit out as <strong>dividends</strong>.</p>
<ul>
  <li><strong>Common stock</strong> gets voting rights and whatever is left after everyone else is paid. Highest risk, highest long-run return.</li>
  <li><strong>Preferred stock</strong> pays a fixed dividend and gets paid before common holders, but usually has no vote and limited upside. It behaves somewhat like a bond.</li>
  <li><strong>Market cap</strong> = share price × shares outstanding. Large cap is roughly over $10 billion, mid cap $2 to $10 billion, small cap under $2 billion.</li>
</ul>

<h2>Bonds (fixed income)</h2>
<p>A bond is a loan you make to a government or company. They pay you interest (the <strong>coupon</strong>) and return the <strong>face value</strong>, usually $1,000, at <strong>maturity</strong>.</p>
<ul>
  <li><strong>Treasuries</strong> are backed by the U.S. government and considered the safest.</li>
  <li><strong>Municipal bonds</strong> are issued by states and cities, often tax-free.</li>
  <li><strong>Corporate bonds</strong> pay more because companies can default. Credit ratings run from AAA down; BBB- and above is "investment grade," below that is "high yield" or "junk."</li>
</ul>
<div class="key"><b>Key idea</b>Bond prices move opposite to interest rates. When rates rise, existing bonds paying lower coupons become less valuable, so their prices fall. Longer bonds fall more. This seesaw shows up on every licensing exam.</div>
<div class="example"><b class="t">Example</b>You own a 10-year bond paying 3%. Rates jump and new bonds pay 5%. Nobody will pay full price for your 3% bond when they can get 5% elsewhere, so its market price drops until its yield to a new buyer is close to 5%.</div>

<h2>Mutual funds</h2>
<p>A mutual fund pools money from many investors and buys a portfolio. You buy and sell at the <strong>net asset value (NAV)</strong>, calculated once a day after the market closes.</p>
<ul>
  <li><strong>Active funds</strong> have managers picking investments to try to beat a benchmark. Most fail to beat it over long periods after fees.</li>
  <li><strong>Index funds</strong> just hold everything in an index, like the S&P 500. Very low cost.</li>
  <li><strong>Share classes</strong> matter for advisors: A shares charge an upfront sales load (often up to 5.75%, with discounts called breakpoints for larger purchases), C shares charge a higher ongoing fee instead. Picking the right class for a client is a classic exam and suitability topic.</li>
</ul>

<h2>ETFs</h2>
<p>Exchange-traded funds hold a basket like a mutual fund but trade on an exchange all day like a stock. Most are index funds with very low fees and are more tax-efficient than mutual funds because of how shares are created and redeemed.</p>

<h2>Expense ratios</h2>
<p>Every fund charges an annual <strong>expense ratio</strong>, a percentage of your balance taken out automatically.</p>
<div class="tbl"><table>
  <thead><tr><th>Fund type</th><th>Typical expense ratio</th><th>Yearly cost on $100,000</th></tr></thead>
  <tbody>
    <tr><td>Broad index ETF</td><td class="n">0.03%</td><td class="n">$30</td></tr>
    <tr><td>Typical active fund</td><td class="n">0.60%</td><td class="n">$600</td></tr>
    <tr><td>Expensive active fund</td><td class="n">1.00%</td><td class="n">$1,000</td></tr>
  </tbody>
</table></div>

<h2>Other things you'll hear about</h2>
<ul>
  <li><strong>Options:</strong> contracts giving the right to buy (call) or sell (put) a stock at a set price by a set date. A big part of the Series 7.</li>
  <li><strong>REITs:</strong> companies that own real estate and must pay out most income as dividends.</li>
  <li><strong>Annuities:</strong> insurance contracts that can turn savings into guaranteed income. Common at full-service firms; often carry high fees and surrender charges.</li>
  <li><strong>Cash equivalents:</strong> money market funds, Treasury bills, CDs.</li>
</ul>`,
  exercise: `<p>Compare three funds on one page. Use the fund company's website or a free site like Morningstar:</p>
<ol>
  <li>An S&P 500 index ETF (for example VOO, IVV, or SPLG).</li>
  <li>An actively managed large-cap U.S. stock fund of your choice.</li>
  <li>A target-date fund for the year you'll turn 65.</li>
</ol>
<p>For each, record the expense ratio, number of holdings, top 5 holdings, and 10-year annual return. Then write two sentences on which you'd choose as the core of a Roth and why.</p>`,
  quiz: [
    { q: "Interest rates rise sharply. What usually happens to existing bond prices?", o: ["They rise", "They fall", "They stay the same", "They become tax-free"], a: 1, why: "Prices and rates move in opposite directions. Long-term bonds are hit hardest." },
    { q: "When is a mutual fund's price (NAV) set?", o: ["Every second the market is open", "Once a day after the market closes", "Once a week", "When the manager decides"], a: 1, why: "Mutual funds price once a day at NAV after the close. ETFs trade all day at market prices." },
    { q: "A company has 500 million shares at $40 each. Its market cap is:", o: ["$20 million", "$2 billion", "$20 billion", "$200 billion"], a: 2, why: "500,000,000 × $40 = $20 billion, which makes it a large-cap company." },
    { q: "A Class A mutual fund share typically charges:", o: ["No fees at all", "An upfront sales charge, reduced at breakpoints", "Only a fee when you sell after 30 years", "A fee paid by the government"], a: 1, why: "A shares have a front-end load that shrinks at higher investment amounts (breakpoints). Advisors must tell clients about breakpoints." },
    { q: "What is a bond's coupon?", o: ["Its credit rating", "The interest it pays", "Its maturity date", "A discount for new buyers"], a: 1, why: "The coupon is the interest rate the issuer pays on the bond's face value." }
  ],
  deeper: `FINRA's <a href="https://www.finra.org/investors/investing/investment-products" target="_blank" rel="noopener">Investment Products</a> guides; <em>The Bogleheads' Guide to Investing</em>.`
},

{
  id: "1-6", phase: 1, num: "1.6", title: "How trading actually works",
  lede: "What happens between clicking Buy and owning a share. You'll use this every day with your tracker, and it's tested heavily on the SIE.",
  minutes: 14,
  body: `
<h2>Exchanges and brokers</h2>
<p>Stocks trade on <strong>exchanges</strong> such as the New York Stock Exchange and Nasdaq, and on other trading venues. You can't trade there directly, so you use a <strong>broker-dealer</strong> (Schwab, Fidelity, Edward Jones). The broker sends your order to a market, which matches it with a seller.</p>

<h2>Bid, ask, and spread</h2>
<ul>
  <li><strong>Bid:</strong> the highest price a buyer is offering right now.</li>
  <li><strong>Ask (or offer):</strong> the lowest price a seller will accept.</li>
  <li><strong>Spread:</strong> the gap between them. Big liquid stocks have spreads of a penny; small, thinly traded stocks can have wide spreads that act as a hidden cost.</li>
</ul>
<div class="example"><b class="t">Example</b>A stock shows Bid $50.10 / Ask $50.14. A market buy fills around $50.14; a market sell fills around $50.10. If you bought and immediately sold, you'd lose the 4 cent spread.</div>

<h2>Order types</h2>
<div class="tbl"><table>
  <thead><tr><th>Order</th><th>What it does</th><th>Use it when</th></tr></thead>
  <tbody>
    <tr><td><strong>Market</strong></td><td>Buys or sells immediately at the best available price</td><td>Speed matters and the stock is very liquid</td></tr>
    <tr><td><strong>Limit</strong></td><td>Buys only at your price or lower, sells only at your price or higher</td><td>You care about price; always use for small or volatile stocks</td></tr>
    <tr><td><strong>Stop (stop-loss)</strong></td><td>Becomes a market order once the price hits your stop</td><td>Limiting losses; can fill well below the stop in a fast drop</td></tr>
    <tr><td><strong>Stop-limit</strong></td><td>Becomes a limit order at the stop</td><td>You want a price floor; may not fill at all</td></tr>
  </tbody>
</table></div>
<p>Orders can be <strong>day orders</strong> (expire at the close) or <strong>good-till-canceled</strong> (stay open, usually up to 60 to 180 days depending on the broker).</p>
<div class="key"><b>Key idea</b>When your tracker flags a small company with an insider buy, use a limit order. Thin trading plus a market order can mean paying several percent more than you expected.</div>

<h2>Settlement and custody</h2>
<ul>
  <li><strong>Settlement</strong> is when cash and shares actually change hands. U.S. stocks settle <strong>T+1</strong>: one business day after the trade date (it moved from T+2 in May 2024).</li>
  <li>Your broker holds shares in "street name" for you. You're still the owner.</li>
  <li><strong>SIPC</strong> protects up to $500,000 per customer (including $250,000 in cash) if a brokerage firm fails. It does not protect against market losses.</li>
</ul>

<h2>Account types and margin</h2>
<p>A <strong>cash account</strong> requires you to pay in full. A <strong>margin account</strong> lets you borrow from the broker to buy more, which magnifies gains and losses and can trigger margin calls. IRAs can't use margin borrowing. <strong>Short selling</strong> means borrowing shares to sell now and buying back later, hoping the price falls; losses are theoretically unlimited.</p>

<h2>Who regulates all this</h2>
<ul>
  <li><strong>SEC (Securities and Exchange Commission):</strong> the federal regulator. Writes rules, enforces securities laws, runs EDGAR where all filings live.</li>
  <li><strong>FINRA:</strong> a self-regulatory organization that oversees broker-dealers and their reps, and runs the SIE and Series 7 exams.</li>
  <li><strong>State securities regulators (NASAA members):</strong> register advisors in each state and oversee the Series 63, 65, and 66.</li>
</ul>`,
  exercise: `<ol>
  <li>Pull up a quote for a large stock (like Apple) and a small stock flagged by your tracker. Write down the bid, ask, and spread for each, and the spread as a percent of the price.</li>
  <li>Check your Roth broker's settings for order types and time-in-force options. Note the default.</li>
  <li>Write a personal rule for when you'll use market versus limit orders.</li>
</ol>`,
  quiz: [
    { q: "A stock is quoted Bid $20.00 / Ask $20.06. A market order to buy will likely fill near:", o: ["$20.00", "$20.03", "$20.06", "$19.94"], a: 2, why: "Buyers pay the ask. Sellers receive the bid." },
    { q: "U.S. stock trades now settle:", o: ["Same day", "T+1", "T+3", "T+5"], a: 1, why: "Settlement moved to one business day after the trade (T+1) in May 2024." },
    { q: "What does SIPC protect against?", o: ["Stock price declines", "Bad investment advice", "A brokerage firm failing and losing customer assets, up to limits", "Inflation"], a: 2, why: "SIPC covers up to $500,000 (including $250,000 cash) when a member firm fails. It never covers market losses." },
    { q: "Which order guarantees your price but not that it fills?", o: ["Market order", "Limit order", "Stop order", "None"], a: 1, why: "A limit order only fills at your price or better, so it may never fill." },
    { q: "Which organization administers the SIE and Series 7 exams?", o: ["The SEC", "FINRA", "The Federal Reserve", "The IRS"], a: 1, why: "FINRA runs the SIE and Series 7. NASAA (state regulators) owns the Series 63, 65, and 66." }
  ],
  deeper: `Investor.gov's "How Stock Markets Work" (search it on <a href="https://www.investor.gov/" target="_blank" rel="noopener">investor.gov</a>); FINRA's SIE content outline, which covers this material.`
},

  body: `
<h2>What you should now be able to do</h2>

    { q: "Selling a stock at a loss and buying it back 10 days later results in:", o: ["A deductible loss", "A wash sale, so the loss is disallowed for now", "A short-term gain", "A penalty from FINRA"], a: 1, why: "Rebuying within 30 days triggers the wash sale rule. The disallowed loss is added to the new shares' cost basis." },

{
  id: "2-1", phase: 2, num: "2.1", title: "Reading the income statement",
  lede: "The income statement shows whether a business makes money and how. Every valuation and every stock pick starts with it.",
  minutes: 18,
  body: `
<h2>Meet Prairie Tools</h2>
<p>All of Phase 2 uses one made-up company so the numbers connect: <strong>Prairie Tools Inc.</strong>, a maker of power tools with 100 million shares trading at $22. All figures are in millions of dollars except per-share numbers.</p>

<h2>The statement, top to bottom</h2>
<p>An income statement covers a period of time (a quarter or a year). It starts with sales and subtracts costs layer by layer until it reaches profit.</p>
<div class="tbl"><table>
  <thead><tr><th>Line</th><th>Prairie Tools</th><th>What it means</th></tr></thead>
  <tbody>
    <tr><td><strong>Revenue</strong></td><td class="n">1,000</td><td>Total sales. The "top line."</td></tr>
    <tr><td>Cost of goods sold (COGS)</td><td class="n">(600)</td><td>Direct cost of making the products: materials, factory labor.</td></tr>
    <tr><td><strong>Gross profit</strong></td><td class="n">400</td><td>Revenue minus COGS.</td></tr>
    <tr><td>Selling, general and admin (SG&A)</td><td class="n">(200)</td><td>Salaries, marketing, rent, overhead.</td></tr>
    <tr><td>Research and development (R&D)</td><td class="n">(50)</td><td>Spending on new products.</td></tr>
    <tr><td><strong>Operating income (EBIT)</strong></td><td class="n">150</td><td>Profit from running the business, before interest and taxes.</td></tr>
    <tr><td>Interest expense</td><td class="n">(10)</td><td>Cost of the company's debt.</td></tr>
    <tr><td>Pretax income</td><td class="n">140</td><td></td></tr>
    <tr><td>Income tax</td><td class="n">(30)</td><td>About a 21% effective rate.</td></tr>
    <tr><td><strong>Net income</strong></td><td class="n">110</td><td>The "bottom line," profit left for shareholders.</td></tr>
    <tr><td><strong>Earnings per share (EPS)</strong></td><td class="n">$1.10</td><td>Net income ÷ 100 million shares.</td></tr>
  </tbody>
</table></div>

<h2>Margins tell the story</h2>
<p>Raw dollars don't let you compare companies of different sizes. Margins do. Each one is a profit line divided by revenue.</p>
<div class="tbl"><table>
  <thead><tr><th>Margin</th><th>Formula</th><th>Prairie Tools</th><th>What it reveals</th></tr></thead>
  <tbody>
    <tr><td>Gross margin</td><td>Gross profit ÷ revenue</td><td class="n">40%</td><td>Pricing power and production cost. Software can run 80%; grocery stores 25%.</td></tr>
    <tr><td>Operating margin</td><td>Operating income ÷ revenue</td><td class="n">15%</td><td>How efficiently the whole business runs.</td></tr>
    <tr><td>Net margin</td><td>Net income ÷ revenue</td><td class="n">11%</td><td>What's left after everything, including debt and taxes.</td></tr>
  </tbody>
</table></div>
<div class="key"><b>Key idea</b>The trend matters more than any one year. Rising margins usually mean a company is gaining pricing power or scale. Shrinking margins mean competition or rising costs are biting.</div>

<h2>EBITDA and "adjusted" numbers</h2>
<p><strong>EBITDA</strong> is earnings before interest, taxes, depreciation, and amortization. Prairie Tools has $40 of depreciation, so EBITDA = 150 + 40 = <strong>190</strong>. It's popular because it compares companies with different debt and asset levels. Be careful: depreciation reflects real money spent on equipment, and Warren Buffett famously asked whether management thinks "the tooth fairy pays for capex."</p>
<p>Many companies also report "adjusted" earnings that leave out items such as stock-based compensation or restructuring costs. These are <strong>non-GAAP</strong> figures (not following standard accounting rules). Always compare them to the GAAP numbers. If "one-time" charges show up every year, they aren't one-time.</p>

<h2>Diluted shares</h2>
<p>EPS is reported "basic" and "diluted." Diluted counts shares that could be created from stock options and convertible securities. Use diluted. A company whose share count rises 3% a year is quietly shrinking your slice of the pie.</p>

<h2>Red flags on the income statement</h2>
<ul>
  <li>Revenue growing while gross margin falls year after year.</li>
  <li>Large gap between adjusted and GAAP earnings.</li>
  <li>Growth that comes only from acquisitions, not from existing business.</li>
  <li>Stock-based compensation above 10% of revenue for a mature company.</li>
</ul>`,
  exercise: `<ol>
  <li>Pick a company you own in your Roth or one your tracker flagged. Go to <a href="https://www.sec.gov/edgar/search/" target="_blank" rel="noopener">SEC EDGAR</a>, search the company, and open its latest 10-K.</li>
  <li>Find the income statement ("Consolidated Statements of Operations"). Record revenue, gross profit, operating income, net income, and diluted EPS for the last 3 years.</li>
  <li>Calculate gross, operating, and net margins for each year in a spreadsheet. Write one sentence on the trend.</li>
</ol>`,
  quiz: [
    { q: "Revenue is $500M and gross profit is $200M. Gross margin is:", o: ["20%", "40%", "60%", "250%"], a: 1, why: "$200M ÷ $500M = 40%." },
    { q: "Operating income is profit:", o: ["After interest and taxes", "Before interest and taxes, from running the business", "Only from investments", "Before cost of goods sold"], a: 1, why: "Operating income (EBIT) is what the business earns from operations before financing costs and taxes." },
    { q: "Net income is $50M and there are 25M diluted shares. EPS is:", o: ["$0.50", "$2.00", "$5.00", "$12.50"], a: 1, why: "$50M ÷ 25M shares = $2.00." },
    { q: "Why use diluted EPS instead of basic?", o: ["It's always higher", "It counts shares that options and convertibles could add", "The IRS requires it", "It excludes taxes"], a: 1, why: "Diluted EPS shows profit per share if all potential shares were created, a more honest figure." },
    { q: "A company reports a 'one-time' restructuring charge four years in a row. That suggests:", o: ["Excellent management", "The charges are really an ongoing cost", "Revenue is growing", "Taxes will fall"], a: 1, why: "Recurring 'one-time' charges are a sign that adjusted earnings overstate the real profit." }
  ],
  deeper: `Investor.gov's "Beginners' Guide to Financial Statements" (search it on <a href="https://www.investor.gov/" target="_blank" rel="noopener">investor.gov</a>); <em>How to Read a Financial Report</em> by Tracy and Tracy.`
},

{
  id: "2-2", phase: 2, num: "2.2", title: "Balance sheet and cash flow",
  lede: "The income statement shows profit. The balance sheet shows what a company owns and owes, and the cash flow statement shows whether profit turns into actual cash.",
  minutes: 20,
  body: `
<h2>The balance sheet: a snapshot</h2>
<p>A balance sheet shows a single moment, the last day of the quarter or year. It always balances:</p>
<p class="formula">Assets = Liabilities + Shareholders' equity</p>
<div class="tbl"><table>
  <thead><tr><th>Assets</th><th>Prairie</th><th>Liabilities and equity</th><th>Prairie</th></tr></thead>
  <tbody>
    <tr><td>Cash</td><td class="n">120</td><td>Accounts payable</td><td class="n">100</td></tr>
    <tr><td>Accounts receivable</td><td class="n">150</td><td>Short-term debt</td><td class="n">50</td></tr>
    <tr><td>Inventory</td><td class="n">180</td><td><em>Total current liabilities</em></td><td class="n">150</td></tr>
    <tr><td><em>Total current assets</em></td><td class="n">450</td><td>Long-term debt</td><td class="n">250</td></tr>
    <tr><td>Property, plant and equipment</td><td class="n">400</td><td>Other liabilities</td><td class="n">100</td></tr>
    <tr><td>Goodwill</td><td class="n">150</td><td><strong>Total liabilities</strong></td><td class="n">500</td></tr>
    <tr><td></td><td></td><td><strong>Shareholders' equity</strong></td><td class="n">500</td></tr>
    <tr><td><strong>Total assets</strong></td><td class="n">1,000</td><td><strong>Total</strong></td><td class="n">1,000</td></tr>
  </tbody>
</table></div>
<ul>
  <li><strong>Current</strong> means within one year. Receivables are money customers owe the company; payables are money the company owes suppliers.</li>
  <li><strong>Goodwill</strong> is the premium paid for acquisitions above the target's book value. If an acquisition flops, goodwill gets "written down," a red flag about past decisions.</li>
  <li><strong>Equity</strong> (also called book value) is what would be left for shareholders if every asset were sold at its accounting value and every debt paid.</li>
</ul>

<h2>Balance sheet ratios</h2>
<div class="tbl"><table>
  <thead><tr><th>Ratio</th><th>Formula</th><th>Prairie</th><th>Rough guide</th></tr></thead>
  <tbody>
    <tr><td>Current ratio</td><td>Current assets ÷ current liabilities</td><td class="n">3.0</td><td>Above 1.5 is comfortable; below 1 can mean a cash squeeze.</td></tr>
    <tr><td>Debt-to-equity</td><td>Total debt ÷ equity</td><td class="n">0.6</td><td>Under 1 is moderate for industrial companies; banks and utilities run higher.</td></tr>
    <tr><td>Net debt</td><td>Total debt − cash</td><td class="n">180</td><td>Compare to EBITDA: under 2× is conservative, over 4× is risky.</td></tr>
    <tr><td>Return on equity (ROE)</td><td>Net income ÷ equity</td><td class="n">22%</td><td>Above 15% sustained is strong, but check that debt isn't inflating it.</td></tr>
  </tbody>
</table></div>

<h2>The cash flow statement: where the money really went</h2>
<p>Net income includes non-cash items and timing differences. The cash flow statement strips those out and shows three buckets:</p>
<div class="tbl"><table>
  <thead><tr><th>Section</th><th>Prairie</th><th>What's in it</th></tr></thead>
  <tbody>
    <tr><td>Net income</td><td class="n">110</td><td>Starting point.</td></tr>
    <tr><td>+ Depreciation</td><td class="n">40</td><td>Non-cash expense, added back.</td></tr>
    <tr><td>− Increase in working capital</td><td class="n">(20)</td><td>More cash tied up in inventory and receivables.</td></tr>
    <tr><td><strong>Cash from operations (CFO)</strong></td><td class="n">130</td><td>Cash the business actually generated.</td></tr>
    <tr><td>Capital expenditures (capex)</td><td class="n">(50)</td><td>Investing section: new equipment and facilities.</td></tr>
    <tr><td>Dividends paid</td><td class="n">(30)</td><td>Financing section.</td></tr>
    <tr><td>Share buybacks</td><td class="n">(20)</td><td>Financing section.</td></tr>
  </tbody>
</table></div>

<h2>Free cash flow: the number that matters most</h2>
<p class="formula">Free cash flow (FCF) = Cash from operations − Capital expenditures</p>
<p>Prairie Tools: 130 − 50 = <strong>$80 million</strong>. That's the cash the company could hand to owners without hurting the business. It's what pays dividends, buys back stock, pays down debt, or funds acquisitions. Over time, a stock's value follows its free cash flow.</p>
<div class="key"><b>Key idea</b>Profit is an opinion; cash is a fact. If net income keeps rising but cash from operations doesn't, find out why before you buy.</div>
<div class="example"><b class="t">Red flag example</b>A company's revenue grows 10% but accounts receivable grows 40%. It may be booking sales to customers who aren't paying, or offering loose credit to hit targets. Cash from operations will lag net income. This pattern preceded several accounting scandals.</div>`,
  exercise: `<ol>
  <li>Using the same company's 10-K from Lesson 2.1, find the balance sheet and cash flow statement.</li>
  <li>Calculate the current ratio, debt-to-equity, net debt, and ROE.</li>
  <li>Calculate free cash flow for the last 3 years and compare it to net income each year. Is cash keeping up with profit?</li>
  <li>Note what the company did with its free cash flow: dividends, buybacks, debt paydown, acquisitions.</li>
</ol>`,
  quiz: [
    { q: "The basic balance sheet equation is:", o: ["Revenue − Expenses = Profit", "Assets = Liabilities + Equity", "Cash = Assets − Debt", "Equity = Revenue × Margin"], a: 1, why: "Everything a company owns is funded either by borrowing (liabilities) or by owners (equity)." },
    { q: "Cash from operations is $300M and capex is $120M. Free cash flow is:", o: ["$120M", "$180M", "$300M", "$420M"], a: 1, why: "$300M − $120M = $180M." },
    { q: "Current assets are $200M and current liabilities are $250M. The current ratio is 0.8. This suggests:", o: ["Very strong liquidity", "Possible difficulty paying short-term bills", "High profitability", "Too much cash"], a: 1, why: "Below 1 means short-term obligations exceed short-term assets." },
    { q: "Receivables are growing much faster than revenue. A careful analyst would:", o: ["Ignore it", "Investigate whether customers are paying and how sales are booked", "Buy more shares", "Assume margins will rise"], a: 1, why: "Ballooning receivables can signal aggressive revenue recognition or weak customers." },
    { q: "Why is depreciation added back in cash from operations?", o: ["It's a tax refund", "It reduced net income but no cash left the company that year", "It's a type of revenue", "The SEC requires it to be ignored"], a: 1, why: "Depreciation spreads the cost of past purchases. The cash was spent when the asset was bought (capex)." }
  ],
  deeper: `<em>Financial Statements</em> by Thomas Ittelson; Wharton's free "Introduction to Financial Accounting" on Coursera (audit option).`
},

{
  id: "2-3", phase: 2, num: "2.3", title: "SEC filings you'll use",
  lede: "Every public company files its numbers and big news with the SEC, free on EDGAR. Knowing which filing answers which question is the backbone of your tracker.",
  minutes: 15,
  body: `
<h2>The core filings</h2>
<div class="tbl"><table>
  <thead><tr><th>Form</th><th>What it is</th><th>When it's due</th><th>Read it for</th></tr></thead>
  <tbody>
    <tr><td><strong>10-K</strong></td><td>Annual report, audited</td><td class="n">60 to 90 days after year end</td><td>Business description, risk factors, full financials, management discussion</td></tr>
    <tr><td><strong>10-Q</strong></td><td>Quarterly report, unaudited</td><td class="n">40 to 45 days after quarter end</td><td>Updated financials and trends</td></tr>
    <tr><td><strong>8-K</strong></td><td>Current report of major events</td><td class="n">Within 4 business days</td><td>Earnings releases, CEO changes, acquisitions, bankruptcies</td></tr>
    <tr><td><strong>DEF 14A</strong></td><td>Proxy statement for the annual meeting</td><td class="n">Before the shareholder meeting</td><td>Executive pay, board members, insider ownership, shareholder votes</td></tr>
    <tr><td><strong>Form 4</strong></td><td>Insider buys and sells</td><td class="n">Within 2 business days</td><td>What officers, directors, and 10% owners are doing with their own shares</td></tr>
    <tr><td><strong>13F</strong></td><td>Quarterly holdings of funds managing $100M+</td><td class="n">Within 45 days after quarter end</td><td>What big investment managers own</td></tr>
    <tr><td><strong>13D / 13G</strong></td><td>Ownership above 5%</td><td class="n">13D within 5 business days</td><td>13D signals an activist who may push for change; 13G is a passive holder</td></tr>
    <tr><td><strong>S-1</strong></td><td>IPO registration</td><td class="n">Before going public</td><td>Everything about a new company coming to market</td></tr>
  </tbody>
</table></div>

<h2>How to read a 10-K without drowning</h2>
<p>A 10-K can run 150 pages. Read these sections, in this order:</p>
<ol>
  <li><strong>Item 1, Business:</strong> what the company sells, to whom, and who it competes with.</li>
  <li><strong>Item 7, Management's Discussion and Analysis (MD&A):</strong> management explains the year's results and what drove them.</li>
  <li><strong>Item 8, Financial Statements:</strong> the three statements plus the notes. The notes hide important details: debt terms, lawsuits, revenue by segment.</li>
  <li><strong>Item 1A, Risk Factors:</strong> skim for anything specific to this company rather than boilerplate. New risk factors compared to last year are worth noticing.</li>
</ol>
<div class="key"><b>Key idea</b>Compare this year's 10-K to last year's. What management stopped talking about, or newly started warning about, is often more revealing than the numbers.</div>

<h2>Earnings season</h2>
<p>Most companies announce quarterly results in a press release (filed as an 8-K) and hold an <strong>earnings call</strong> where analysts ask questions. The stock moves on results versus expectations. Beating Wall Street's estimate by a penny while cutting next quarter's guidance often sends a stock down. Transcripts are posted on company investor-relations sites.</p>

<h2>Using EDGAR</h2>
<ul>
  <li>Company search: type a name or ticker at <a href="https://www.sec.gov/edgar/search/" target="_blank" rel="noopener">sec.gov/edgar/search</a> and filter by form type.</li>
  <li>Full-text search lets you search the words inside every filing since 2001, for example "going concern" or a supplier's name.</li>
  <li>EDGAR also offers free data feeds (the APIs your tracker can use) for filings and XBRL financial data. The SEC asks automated tools to identify themselves and stay under 10 requests per second.</li>
</ul>`,
  exercise: `<ol>
  <li>For your chosen company, list its last 10 filings on EDGAR and identify each form type.</li>
  <li>Read Item 1 and Item 7 of the latest 10-K. Write a half-page summary: how the company makes money, what drove last year's results, and the 3 risks you think matter most.</li>
  <li>Open the proxy (DEF 14A). Find the CEO's total pay and how much stock the CEO owns. Is the CEO's wealth tied to the share price?</li>
</ol>`,
  quiz: [
    { q: "Which filing must report a CEO's resignation within 4 business days?", o: ["10-K", "8-K", "13F", "S-1"], a: 1, why: "8-Ks report material events quickly, including executive departures." },
    { q: "Where do you find executive compensation details?", o: ["Form 4", "The proxy statement (DEF 14A)", "13F", "The 10-Q cover page"], a: 1, why: "The proxy statement lays out executive pay, board details, and voting items." },
    { q: "A hedge fund files a 13D on a company. This usually means:", o: ["The fund sold all its shares", "It owns over 5% and may push for changes", "The company is going bankrupt", "The fund manages under $100M"], a: 1, why: "A 13D is filed by holders above 5% who may seek influence. Passive holders file a 13G." },
    { q: "Which section of a 10-K explains management's view of results?", o: ["Item 1A, Risk Factors", "Item 7, MD&A", "Exhibits", "The auditor's signature"], a: 1, why: "Management's Discussion and Analysis (Item 7) walks through what happened and why." },
    { q: "How soon must insiders report most trades on Form 4?", o: ["Same day", "Within 2 business days", "Within 45 days", "Once a year"], a: 1, why: "Form 4 is due within two business days, which makes it the fastest insider signal." }
  ],

},
/* ---------------- 2.4 ---------------- */
{
  id: "2-4", phase: 2, num: "2.4", title: "Valuation: from P/E to DCF",
  lede: "A great company can be a bad investment if you pay too much. Valuation is how you decide what a share is actually worth.",
  minutes: 25,
  body: `
<h2>Price is what you pay, value is what you get</h2>
<p>That line from Warren Buffett is the whole idea. The market gives you a price every second. Your job is to estimate value independently, then buy only when price is meaningfully below it.</p>

<h2>Multiples: quick comparisons</h2>
<p>Prairie Tools trades at $22 with 100 million shares, so its <strong>market cap</strong> is $2,200 million.</p>
<div class="tbl"><table>
  <thead><tr><th>Multiple</th><th>Formula</th><th>Prairie</th><th>Notes</th></tr></thead>
  <tbody>
    <tr><td>P/E (price-to-earnings)</td><td>Price ÷ EPS</td><td class="n">20.0</td><td>$22 ÷ $1.10. You pay $20 for every $1 of annual profit. The S&P 500 has averaged around 16 to 20 over long periods.</td></tr>
    <tr><td>EV/EBITDA</td><td>Enterprise value ÷ EBITDA</td><td class="n">12.5</td><td>Accounts for debt. Better for comparing companies with different debt levels.</td></tr>
    <tr><td>FCF yield</td><td>Free cash flow ÷ market cap</td><td class="n">3.6%</td><td>$80 ÷ $2,200. Compare to bond yields: is the cash return worth the risk?</td></tr>
    <tr><td>P/B (price-to-book)</td><td>Market cap ÷ equity</td><td class="n">4.4</td><td>Most useful for banks and insurers.</td></tr>
    <tr><td>Dividend yield</td><td>Annual dividends ÷ market cap</td><td class="n">1.4%</td><td>$30 ÷ $2,200.</td></tr>
  </tbody>
</table></div>
<p><strong>Enterprise value (EV)</strong> is the price to buy the whole business, debts included: market cap + debt − cash = 2,200 + 300 − 120 = <strong>$2,380 million</strong>.</p>
<div class="key"><b>Key idea</b>A multiple means nothing alone. Compare it to the company's own history, to close competitors, and to its growth rate. A P/E of 30 can be cheap for a company growing 25% a year; a P/E of 10 can be expensive for one that's shrinking.</div>

<h2>Discounted cash flow (DCF): what the business is worth</h2>
<p>A stock is worth all the cash it will produce in the future, adjusted for the fact that money later is worth less than money now. A DCF has four steps.</p>
<ol>
  <li><strong>Project free cash flow.</strong> Prairie makes $80M today. Assume it grows 8% a year for 5 years.</li>
  <li><strong>Pick a discount rate.</strong> This is the return you require for the risk. 8% to 10% is common for a stable company. We'll use 9%.</li>
  <li><strong>Estimate a terminal value</strong> for all years after year 5, assuming slow, permanent growth (2% to 3%, roughly the economy's long-run rate).</li>
  <li><strong>Discount everything to today</strong> and convert to a per-share value.</li>
</ol>
<div class="tbl"><table>
  <thead><tr><th>Year</th><th>FCF ($M)</th><th>Discount factor at 9%</th><th>Present value</th></tr></thead>
  <tbody>
    <tr><td class="n">1</td><td class="n">86.4</td><td class="n">÷ 1.090</td><td class="n">79.3</td></tr>
    <tr><td class="n">2</td><td class="n">93.3</td><td class="n">÷ 1.188</td><td class="n">78.5</td></tr>
    <tr><td class="n">3</td><td class="n">100.8</td><td class="n">÷ 1.295</td><td class="n">77.8</td></tr>
    <tr><td class="n">4</td><td class="n">108.8</td><td class="n">÷ 1.412</td><td class="n">77.1</td></tr>
    <tr><td class="n">5</td><td class="n">117.5</td><td class="n">÷ 1.539</td><td class="n">76.4</td></tr>
    <tr><td><strong>Sum of years 1 to 5</strong></td><td></td><td></td><td class="n">389</td></tr>
  </tbody>
</table></div>
<p class="formula">Terminal value = FCF₅ × (1 + g) ÷ (r − g) = 117.5 × 1.03 ÷ (0.09 − 0.03) ≈ 2,018</p>
<p>Discounted back 5 years: 2,018 ÷ 1.539 ≈ <strong>1,311</strong>. Enterprise value = 389 + 1,311 = <strong>1,701</strong>. Subtract net debt of 180 to get equity value of <strong>1,521</strong>, or about <strong>$15.20 per share</strong>.</p>
<div class="example"><b class="t">What this tells you</b>Prairie trades at $22, but our DCF says $15.20. Either the market expects much faster growth than 8%, or the stock is expensive. A good analyst then asks: what growth rate would justify $22? If that requires heroic assumptions, pass.</div>

<h2>Margin of safety</h2>
<p>Your estimate will be wrong. Benjamin Graham's answer was a <strong>margin of safety</strong>: buy only when the price is well below your value estimate, often 25% to 35% below. If you think a stock is worth $30, you'd want to buy around $20 to $22. The cushion absorbs your mistakes.</p>

<h2>DCF warnings</h2>
<ul>
  <li>The terminal value is usually 60% to 80% of the total. Small changes in growth or discount rate swing the result hugely, so test a range.</li>
  <li>Never let terminal growth exceed the discount rate (the formula breaks) or long-run economic growth.</li>
  <li>A DCF is a way to make your assumptions explicit, not a precise answer.</li>
</ul>`,

</ol>`,

  body: `
<h2>What a moat is</h2>
<p>A <strong>moat</strong> is a durable competitive advantage that protects a company's profits from competitors, the way a moat protects a castle. High profits attract competition. Without a moat, competitors copy the product and cut prices until profits shrink to average.</p>

<h2>The five common sources of a moat</h2>
<div class="tbl"><table>
  <thead><tr><th>Moat</th><th>How it works</th><th>Examples of the type</th></tr></thead>
  <tbody>
    <tr><td><strong>Intangible assets</strong></td><td>Brands people pay more for, patents, government licenses</td><td>Premium consumer brands, drug patents</td></tr>
    <tr><td><strong>Switching costs</strong></td><td>Leaving is painful, expensive, or risky for customers</td><td>Business software, banks, medical devices doctors train on</td></tr>
    <tr><td><strong>Network effects</strong></td><td>The product gets more valuable as more people use it</td><td>Payment networks, marketplaces, exchanges</td></tr>
    <tr><td><strong>Cost advantage</strong></td><td>Producing cheaper than anyone else through scale, location, or process</td><td>Warehouse retailers, low-cost producers of commodities</td></tr>
    <tr><td><strong>Efficient scale</strong></td><td>A market only big enough for one or two players</td><td>Pipelines, regional airports, rail lines</td></tr>
  </tbody>
</table></div>

<h2>Proving a moat with numbers</h2>
<p>Stories are easy; look for evidence. The best single test is <strong>return on invested capital (ROIC)</strong>:</p>
<p class="formula">ROIC = Operating income after tax ÷ (Debt + Equity − Cash)</p>
<p>Prairie Tools: 150 × (1 − 0.21) ÷ (300 + 500 − 120) = 118 ÷ 680 ≈ <strong>17%</strong>. A company that earns well above its cost of capital (roughly 8% to 10%) for 10 years running almost certainly has a moat. Also look for steady or rising gross margins and market share.</p>
<div class="key"><b>Key idea</b>Growth only creates value when ROIC is above the cost of capital. A company growing fast at a 5% ROIC is destroying value with every dollar it reinvests.</div>

<h2>Judging management</h2>
<p>Management decides what to do with every dollar of free cash flow. That's called <strong>capital allocation</strong>, and there are only five choices: reinvest in the business, acquire other companies, pay dividends, buy back stock, or pay down debt. Good managers pick the one with the best return at the time.</p>
<ul>
  <li><strong>Buybacks</strong> are smart when the stock is below its value and wasteful when it's expensive. Check whether the share count actually falls, or whether buybacks just offset stock handed to employees.</li>
  <li><strong>Acquisitions</strong> are where value most often gets destroyed. A history of goodwill write-downs is a warning.</li>
  <li><strong>Insider ownership:</strong> managers who own a lot of stock think like owners. The proxy tells you how much they hold.</li>
  <li><strong>Pay structure:</strong> are bonuses tied to per-share value and ROIC, or just to revenue size and "adjusted" earnings that are easy to game?</li>
  <li><strong>Candor:</strong> read the CEO's shareholder letters. Do they admit mistakes and explain them plainly? Berkshire Hathaway's letters are the model.</li>
</ul>

<h2>Writing an investment memo</h2>
<p>Every serious investor writes their thesis down. A one-to-two page memo should answer:</p>
<ol>
  <li>What does the company do and how does it make money?</li>
  <li>Why does it win? What's the moat, and what's the evidence?</li>
  <li>Is management allocating capital well?</li>
  <li>What is it worth (bear, base, bull) and what's the price today?</li>
  <li>What are the 3 biggest risks?</li>
  <li><strong>What would make you sell?</strong> Write specific, checkable conditions before you buy.</li>
</ol>`,
  exercise: `<ol>

  <li>Calculate ROIC for the latest year using the formula above.</li>
  <li>Check its share count over 5 years in the 10-Ks. Did buybacks reduce it?</li>
  <li>Write a full investment memo using the 6 questions. This is your first of three memos for Milestone 2.</li>
</ol>`,

{
  id: "3-1", phase: 3, num: "3.1", title: "Risk, return, and diversification",
  lede: "Higher returns come with higher risk. Diversification is how you keep the return while shedding the risk you don't get paid for.",
  minutes: 18,
  body: `
<h2>What "risk" means to a professional</h2>
<p>To most people, risk means losing money. To an advisor it has a more precise meaning: how much returns <strong>vary</strong> around their average. The usual measure is <strong>standard deviation</strong>. A fund averaging 8% with a standard deviation of 15% will land between −7% and +23% in about two years out of three, and worse than that the rest of the time.</p>
<div class="tbl"><table>
  <thead><tr><th>Asset</th><th>Long-run average yearly return (approx.)</th><th>Typical yearly swing (std. dev.)</th><th>Worst drops in history</th></tr></thead>
  <tbody>
    <tr><td>Cash / T-bills</td><td class="n">3%</td><td class="n">~1%</td><td>Loses to inflation, rarely falls in dollars</td></tr>
    <tr><td>Intermediate bonds</td><td class="n">5%</td><td class="n">~5%</td><td>About −13% in 2022</td></tr>
    <tr><td>U.S. large stocks</td><td class="n">10%</td><td class="n">~16% to 20%</td><td>About −50% in 2008–09, −34% in early 2020</td></tr>
    <tr><td>Single stocks</td><td class="n">Varies wildly</td><td class="n">Often 30% to 60%</td><td>−100% (bankruptcy)</td></tr>
  </tbody>
</table></div>
<p>These are rough historical figures for U.S. markets before inflation, for building intuition. They are not forecasts.</p>

<h2>Two kinds of risk</h2>
<ul>
  <li><strong>Systematic (market) risk:</strong> recessions, interest rates, wars. It hits everything at once and can't be diversified away. Investors are paid for bearing it, which is why stocks return more than cash over time.</li>
  <li><strong>Unsystematic (company) risk:</strong> a CEO scandal, a failed product, a lawsuit. It hits one company. You can almost eliminate it by owning many companies, so the market doesn't pay you for taking it.</li>
</ul>
<div class="key"><b>Key idea</b>Stock pickers voluntarily take company-specific risk. That's fine as long as you size positions so no single mistake can sink you (Lesson 3.4), and you believe your research gives you an edge worth that risk.</div>

<h2>How diversification works</h2>
<p>Diversification works because things don't all move together. <strong>Correlation</strong> measures that, from +1 (move in lockstep) to −1 (move opposite). Combining assets with low correlation smooths the ride.</p>
<ul>
  <li>Owning about 20 to 30 stocks across different industries removes most company-specific risk.</li>
  <li>Owning 20 bank stocks is not diversified; they share the same risks.</li>
  <li>High-quality bonds have often risen when stocks crashed, though not always (2022 hit both).</li>
</ul>

<h2>Beta</h2>
<p><strong>Beta</strong> measures how much a stock moves with the overall market. A beta of 1.0 moves with the market; 1.5 tends to move 50% more in both directions; 0.6 moves less. Utilities often have low betas; tech and small companies often high ones.</p>

<h2>Risk-adjusted return</h2>
<p>A 15% return with wild swings may be worse than 12% with calm ones. The <strong>Sharpe ratio</strong> measures return per unit of risk:</p>
<p class="formula">Sharpe = (Portfolio return − Risk-free rate) ÷ Standard deviation</p>
<p>Higher is better. It's how professionals compare managers fairly.</p>

<h2>Modern Portfolio Theory in one paragraph</h2>
<p>Harry Markowitz showed in 1952 that for any level of risk there's a mix of assets that gives the highest expected return. Plotting those best mixes draws the <strong>efficient frontier</strong>. The practical lesson: don't judge an investment alone, judge what it does to the whole portfolio.</p>

<h2>Sequence risk and drawdowns</h2>
<p>A <strong>drawdown</strong> is the fall from a peak to a low. Losses are harder to recover than they look: a 50% loss needs a 100% gain just to break even. For retirees, a crash early in retirement while they're withdrawing money (<strong>sequence-of-returns risk</strong>) can permanently damage a plan, which is why advisors shift clients toward bonds as retirement nears.</p>`,

  <li>Enter your holdings into a free backtesting tool such as Portfolio Visualizer and note the worst drawdown and standard deviation versus an S&P 500 index fund.</li>
</ol>`,

{
  id: "3-2", phase: 3, num: "3.2", title: "Asset allocation and bonds",
  lede: "How you split money between stocks, bonds, and cash explains most of a portfolio's ups and downs. It's the first decision an advisor makes for every client.",
  minutes: 20,
  body: `
<h2>Asset allocation first, picks second</h2>
<p>Research on pension funds has found that the mix of asset classes explains the large majority of how much a portfolio's value swings over time. The specific stocks and funds matter far less. That's why advisors set allocation before discussing any individual investment.</p>

<h2>Classic allocations</h2>
<div class="tbl"><table>
  <thead><tr><th>Client</th><th>Stocks</th><th>Bonds</th><th>Cash</th><th>Why</th></tr></thead>
  <tbody>
    <tr><td>Age 25, long horizon, steady job</td><td class="n">90%</td><td class="n">10%</td><td class="n">0%</td><td>Decades to recover from crashes; growth matters most</td></tr>
    <tr><td>Age 45, saving for retirement</td><td class="n">70%</td><td class="n">25%</td><td class="n">5%</td><td>Still growth-focused, starting to dampen swings</td></tr>
    <tr><td>Age 60, retiring in 5 years</td><td class="n">55%</td><td class="n">40%</td><td class="n">5%</td><td>Protect against a crash right before withdrawals begin</td></tr>
    <tr><td>Age 75, living on the portfolio</td><td class="n">40%</td><td class="n">50%</td><td class="n">10%</td><td>Income and stability, but still some growth to fight inflation</td></tr>
  </tbody>
</table></div>
<p>Rules of thumb like "110 minus your age in stocks" are starting points only. Risk capacity, other income (pensions, Social Security), and temperament all shift it.</p>
<p><strong>Target-date funds</strong> do this automatically, sliding from stocks to bonds as the target year nears (the "glide path").</p>

<h2>Bonds in depth</h2>
<p>You learned in 1.5 that bond prices move opposite to rates. Here's the vocabulary you need for clients and the Series 7.</p>
<ul>
  <li><strong>Par</strong> is face value, usually $1,000. A bond trading above par is at a <strong>premium</strong>; below par, a <strong>discount</strong>.</li>
  <li><strong>Coupon rate:</strong> the fixed interest rate on par. A 5% coupon pays $50 a year.</li>
  <li><strong>Current yield:</strong> annual coupon ÷ current price. A 5% bond priced at $900 has a current yield of 50 ÷ 900 = 5.56%.</li>
  <li><strong>Yield to maturity (YTM):</strong> the total return if you hold to maturity, including the gain or loss back to par.</li>
  <li><strong>Duration:</strong> a bond's sensitivity to interest rates, in years. A duration of 6 means a 1% rate rise drops the price about 6%.</li>
</ul>
<div class="key"><b>Key idea</b>For a discount bond: coupon &lt; current yield &lt; YTM. For a premium bond it's the reverse: coupon &gt; current yield &gt; YTM. This ordering is a guaranteed exam question.</div>

<h2>Bond risks</h2>
<ul>
  <li><strong>Interest rate risk:</strong> prices fall when rates rise; longer bonds fall more.</li>
  <li><strong>Credit (default) risk:</strong> the issuer can't pay. Ratings from Moody's and S&P measure it.</li>
  <li><strong>Inflation risk:</strong> fixed payments buy less over time. TIPS (Treasury Inflation-Protected Securities) adjust for it.</li>
  <li><strong>Call risk:</strong> the issuer repays early when rates fall, and you must reinvest at lower rates.</li>
  <li><strong>Reinvestment risk:</strong> coupons get reinvested at lower rates.</li>
</ul>

<h2>Rebalancing</h2>
<p>Over time, winners grow and your mix drifts. A 60/40 portfolio after a big stock rally might become 72/28, which is riskier than intended. <strong>Rebalancing</strong> means selling some of what's grown and buying what's lagged to get back to target. Common approaches: once a year, or whenever an asset class drifts more than 5 percentage points. Inside a Roth, rebalancing has no tax cost.</p>

<h2>Annuities: guaranteed income</h2>
<p>An <strong>annuity</strong> is an insurance contract. You give an insurer money, and it promises payments, sometimes for life. <strong>Immediate annuities</strong> start paying now. <strong>Fixed</strong> annuities pay a set rate; <strong>variable</strong> annuities invest in subaccounts (and need a securities license to sell); <strong>indexed</strong> annuities credit returns linked to an index with caps and floors. They can solve the "running out of money" fear, but many carry high fees and surrender charges for 7 to 10 years. You'll meet them constantly at a full-service firm.</p>`,
  exercise: `<ol>
  <li>Design three model portfolios (age 25 aggressive, age 50 balanced, age 70 income) using only low-cost funds. Name each fund, its ticker, and its percentage.</li>
  <li>Write a short paragraph for each, explaining it in plain language as if to a client.</li>
  <li>Calculate your own Roth's current stock/bond/cash split and decide on your target mix in writing.</li>
</ol>`,

{
  id: "3-3", phase: 3, num: "3.3", title: "Behavioral finance",
  lede: "Most investors lose more to their own reactions than to bad picks. Advisors earn their fees by managing behavior, starting with their own.",
  minutes: 15,
  body: `
<h2>The behavior gap</h2>
<p>Studies of fund investors consistently find that the average investor earns less than the funds they own, because they buy after prices rise and sell after they fall. Morningstar's yearly "Mind the Gap" research has put that gap around 1 percentage point a year. Over 30 years, that's a quarter or more of your ending wealth.</p>

<h2>The biases to know</h2>
<div class="tbl"><table>
  <thead><tr><th>Bias</th><th>What it looks like</th><th>The fix</th></tr></thead>
  <tbody>
    <tr><td><strong>Loss aversion</strong></td><td>Losses hurt about twice as much as equal gains feel good. Holding losers to avoid "making it real."</td><td>Ask: would I buy this today at this price? If not, why own it?</td></tr>
    <tr><td><strong>Overconfidence</strong></td><td>Trading too often, concentrating too much, believing you know more than the market</td><td>Keep a journal and track your real results against an index fund</td></tr>
    <tr><td><strong>Confirmation bias</strong></td><td>Reading only bullish takes on stocks you own</td><td>Write the bear case for every holding</td></tr>
    <tr><td><strong>Recency bias</strong></td><td>Assuming the last year's trend will continue forever</td><td>Look at 20+ year history before deciding</td></tr>
    <tr><td><strong>Herding</strong></td><td>Buying what everyone's talking about</td><td>A 48-hour rule before buying anything trending</td></tr>
    <tr><td><strong>Anchoring</strong></td><td>"I'll sell when it gets back to what I paid"</td><td>The market doesn't know your cost basis; value the business now</td></tr>
    <tr><td><strong>Disposition effect</strong></td><td>Selling winners too early, holding losers too long</td><td>Let your written "sell if" rules decide</td></tr>
    <tr><td><strong>Mental accounting</strong></td><td>Treating "house money" gains more recklessly</td><td>A dollar is a dollar wherever it came from</td></tr>
  </tbody>
</table></div>
<div class="key"><b>Key idea</b>Signal trackers can amplify bias. A congressional buy can feel like insider confirmation of what you already believed. Treat every signal as a question to research, never as proof.</div>

<h2>Behavior in clients</h2>
<p>In March 2020, stocks fell about a third in a few weeks. Advisors spent those weeks on the phone persuading clients not to sell at the bottom; markets recovered to new highs within months. Many experienced advisors say talking clients out of panic in moments like that is the most valuable thing they ever do. Techniques that work:</p>
<ul>
  <li>Set expectations before a crash: "Expect a 30% drop at some point in any 10-year period."</li>
  <li>Tie the portfolio to goals, not to the daily market.</li>
  <li>Use "bucket" plans: two to three years of spending in cash and bonds so clients know their near-term needs are safe.</li>
</ul>

<h2>The investing journal</h2>
<p>A journal is the single best tool against bias. For every trade, write the date, price, reason, what you expect to happen, and when you'll review it. Review monthly and ask: was I right for the right reasons?</p>`,

  <li>Identify the bias you're most prone to. Write one rule to guard against it.</li>
</ol>`,

  body: `
<h2>Core and satellite</h2>
<p>Many advisors and serious individual investors use a <strong>core and satellite</strong> structure:</p>
<ul>
  <li><strong>Core (60% to 90%):</strong> low-cost, diversified index funds. This guarantees you roughly the market return.</li>
  <li><strong>Satellite (10% to 40%):</strong> individual stocks from your own research and tracker. This is where you try to beat the market.</li>
</ul>
<p>The core protects you from your own mistakes. The satellite lets you apply what you learn. Over time, track whether the satellite actually beats the core. If it doesn't after several years, shift more to the core.</p>

<h2>How big should one position be?</h2>
<div class="tbl"><table>
  <thead><tr><th>Approach</th><th>Max per stock (at purchase)</th><th>Number of stocks</th><th>Fits</th></tr></thead>
  <tbody>
    <tr><td>Conservative</td><td class="n">2% to 3% of total</td><td class="n">20 to 40</td><td>Beginners; anyone whose satellite is small</td></tr>
    <tr><td>Moderate</td><td class="n">5%</td><td class="n">12 to 20</td><td>Experienced pickers with a written process</td></tr>
    <tr><td>Concentrated</td><td class="n">10% or more</td><td class="n">5 to 10</td><td>Professionals with deep research and high risk tolerance</td></tr>
  </tbody>
</table></div>
<div class="example"><b class="t">Example</b>Your Roth is $40,000 and you choose 75% core, 25% satellite. The satellite is $10,000. With a 3% cap per stock ($1,200), you'd hold about 8 stocks. If one goes to zero, you lose 3% of the account. Painful, but recoverable.</div>

<h2>Sizing by conviction and risk</h2>
<ul>
  <li><strong>Start small and add.</strong> Buy a half position first. Add when the thesis is confirmed by results, not just by price.</li>
  <li><strong>Riskier companies get smaller sizes.</strong> An unprofitable small cap should be smaller than a profitable large cap, even if you're equally excited.</li>
  <li><strong>Set a trim rule.</strong> If one position grows past, say, 10% of the account, trim it back. Winners can become accidental concentration.</li>
</ul>

<h2>The investment policy statement (IPS)</h2>
<p>Advisors write an IPS for clients: a document stating goals, time horizon, target allocation, rebalancing rules, and what's off-limits. Writing one for yourself turns good intentions into rules you'll follow in a panic. A personal IPS should include:</p>
<ol>
  <li>Goal and time horizon for the account.</li>
  <li>Target allocation: core vs satellite, stocks vs bonds.</li>
  <li>Position limits (max per stock, per industry).</li>
  <li>What you won't buy (for example, no options, no penny stocks, no single signal-only trades).</li>
  <li>Rebalancing schedule.</li>
  <li>How you'll measure success (benchmark).</li>
</ol>`,
