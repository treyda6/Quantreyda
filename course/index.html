{
  id: "4-1", phase: 4, num: "4.1", title: "Form 4 insider trades",
  lede: "When executives buy their own company's stock with their own money, it's one of the most studied signals in investing. Most insider activity, though, means nothing.",
  minutes: 18,
  body: `
<h2>Who counts as an insider</h2>
<p>Under Section 16 of the Securities Exchange Act, <strong>insiders</strong> are a company's officers (CEO, CFO, and other executives), directors, and anyone owning more than 10% of a class of its stock. They must report trades in the company's stock on <strong>Form 4</strong> within <strong>two business days</strong>. Form 3 is filed when someone first becomes an insider; Form 5 is an annual catch-up for certain small or exempt transactions.</p>

<h2>Reading the transaction codes</h2>
<p>Each line of a Form 4 has a code. These matter most:</p>
<div class="tbl"><table>
  <thead><tr><th>Code</th><th>Meaning</th><th>Signal value</th></tr></thead>
  <tbody>
    <tr><td class="n">P</td><td>Open-market or private purchase</td><td><strong>High.</strong> Insider spent their own cash.</td></tr>
    <tr><td class="n">S</td><td>Open-market or private sale</td><td>Low on its own. People sell for many reasons.</td></tr>
    <tr><td class="n">A</td><td>Grant or award from the company</td><td>None. It's compensation.</td></tr>
    <tr><td class="n">M</td><td>Exercise of options</td><td>None by itself.</td></tr>
    <tr><td class="n">F</td><td>Shares withheld to pay taxes</td><td>None. Automatic.</td></tr>
    <tr><td class="n">G</td><td>Gift</td><td>None.</td></tr>
  </tbody>
</table></div>
<p>A Form 4 also shows whether ownership is <strong>direct</strong> or <strong>indirect</strong> (through a trust or family member), the price, and shares held after the trade. A footnote often says whether a sale was under a <strong>10b5-1 plan</strong>.</p>

<h2>Why buys matter more than sells</h2>
<p>As fund manager Peter Lynch put it, insiders sell for many reasons, but they buy for only one: they think the price will rise. Insiders sell to pay taxes, buy houses, diversify, or because their pay comes in stock. Academic research going back decades has found that insider <em>purchases</em> have historically been followed by above-market returns on average, while sales carry far less information.</p>
<p>A widely cited 2012 study by Cohen, Malloy, and Pomorski separated "routine" insiders (who trade in the same month every year) from "opportunistic" ones. The routine trades predicted nothing; the opportunistic trades carried the signal. Your tracker should try to flag the difference.</p>

<h2>What makes a buy signal stronger</h2>
<ul>
  <li><strong>Who:</strong> the CEO or CFO knows the most. A director buying is weaker.</li>
  <li><strong>Size:</strong> relative to the insider's wealth and salary. A CEO buying $2 million is meaningful; $15,000 may be for show.</li>
  <li><strong>Clusters:</strong> several insiders buying within a few weeks.</li>
  <li><strong>Context:</strong> buying after a big price drop, especially when the news is bad, shows conviction.</li>
  <li><strong>First purchase in years</strong> beats a routine annual buy.</li>
  <li><strong>Small and mid caps:</strong> research suggests the signal is stronger where fewer analysts follow the stock.</li>
</ul>

<h2>When sells do matter</h2>
<ul>
  <li>Several top executives selling large chunks at once, outside 10b5-1 plans.</li>
  <li>A founder selling most of their stake.</li>
  <li>Selling right before bad news (which may trigger an SEC investigation).</li>
</ul>

<h2>10b5-1 plans and the short-swing rule</h2>
<p>A <strong>Rule 10b5-1 plan</strong> lets insiders schedule trades in advance, which protects them from insider trading claims. Since 2023 amendments, officers and directors must wait a cooling-off period (generally 90 days or more) before the first trade under a new plan, and companies must disclose plan adoptions. Trades under these plans are pre-scheduled, so they carry less information.</p>
<p>The <strong>short-swing profit rule</strong> (Section 16(b)) makes insiders return any profit from buying and selling (or selling and buying) within six months. That's one reason insider buys tend to be longer-term bets.</p>`,
  exercise: `<ol>
  <li>Pull 5 recent Form 4 filings from your tracker or EDGAR. For each, record the insider's role, the code, dollar amount, and whether it was under a 10b5-1 plan.</li>
  <li>Classify each as high, medium, or low signal using the factors above. Write one sentence of reasoning per filing.</li>
  <li>Add a "routine vs opportunistic" flag to your tracker: does this insider trade in the same month every year?</li>
</ol>`,

    { q: "Form 4 must be filed within:", o: ["2 business days", "10 days", "45 days", "One quarter"], a: 0, why: "Two business days after the transaction." },

    { q: "Under the short-swing rule, an insider who buys and sells within 6 months at a profit must:", o: ["Pay a 10% fine", "Return the profit to the company", "Nothing", "Report it on a 13F"], a: 1, why: "Section 16(b) requires disgorgement of short-swing profits to the company." },

  id: "4-2", phase: 4, num: "4.2", title: "Congressional trades",
  lede: "Members of Congress must disclose their stock trades. It's a popular signal, but the delays and gaps in the data make it much weaker than it looks.",
  minutes: 15,
  body: `
<h2>The rules: the STOCK Act</h2>
<p>The <strong>STOCK Act</strong> of 2012 confirmed that members of Congress can't trade on non-public information from their jobs and required them to report trades. Key rules:</p>
<ul>
  <li>Members file a <strong>Periodic Transaction Report (PTR)</strong> for trades over $1,000 in stocks, bonds, and similar assets, including trades by their spouse and dependent children.</li>
  <li>The report is due within <strong>30 days of learning of the trade</strong>, and no later than <strong>45 days after the trade</strong>.</li>
  <li>Amounts are reported in <strong>ranges</strong> ($1,001–$15,000; $15,001–$50,000; and so on up to over $50 million), not exact figures.</li>
  <li>The penalty for late filing is typically just $200, and many reports have been filed late.</li>
  <li>Mutual funds and broad-market ETFs are generally exempt from reporting.</li>
</ul>
<p>Reports are public on the House Clerk and Senate disclosure websites, which most trackers scrape.</p>

<h2>What the research says</h2>
<p>Studies of Senate trades from the 1990s found strong outperformance. Later studies covering the 2000s found that, on average, members' portfolios did <em>not</em> beat the market. More recent analyses are mixed: some find specific members or committee-related trades did well, while the average is close to the market. Funds that copy congressional trades exist, and their results have not consistently beaten simple index funds.</p>
<div class="key"><b>Key idea</b>By the time a congressional trade is public, it may be up to 45 days old, the exact size is unknown, and it may have been made by a spouse or a hired money manager. Treat it as a hint about where to look, not as a buy signal.</div>

<h2>How to use it well</h2>
<ul>
  <li><strong>Look for committee relevance.</strong> A member on the Armed Services Committee buying a defense contractor is more interesting than a random trade.</li>
  <li><strong>Watch for clusters</strong> across several members in the same stock or sector.</li>
  <li><strong>Prefer larger ranges.</strong> A $1M to $5M purchase means more than $1,001 to $15,000.</li>
  <li><strong>Check the filing delay.</strong> A trade disclosed on day 44 is stale. Compare today's price to the trade date price; if it's already moved 20%, the opportunity may be gone.</li>
  <li><strong>Filter out managed accounts.</strong> Some members disclose that a broker manages their account without their input.</li>
  <li><strong>Options trades</strong> are reported too and can be informative, but are riskier to copy.</li>
</ul>
<div class="example"><b class="t">Example</b>Your tracker shows a senator bought $250,001–$500,000 of a semiconductor company. The filing was made 41 days after the trade, and the stock is up 18% since. Two other members bought the same sector last month. Good process: note the sector cluster, then run the company through your Phase 2 analysis at today's price. Bad process: buy immediately because "they know something."</div>`,

  <li>Write three sentences on what you found.</li>
</ol>`,

  id: "4-3", phase: 4, num: "4.3", title: "13F fund holdings",
  lede: "Big investment managers must show their holdings every quarter. Following great investors is tempting, but 13Fs show an old, partial picture.",
  minutes: 14,
  body: `
<h2>What a 13F is</h2>
<p>Any institutional investment manager with discretion over at least <strong>$100 million</strong> in qualifying U.S. securities must file a <strong>Form 13F</strong> each quarter, within <strong>45 days after quarter end</strong>. It lists long positions in U.S.-listed stocks, certain options, and convertible bonds, with share counts and values.</p>

<h2>What a 13F does not show</h2>
<ul>
  <li><strong>Short positions</strong> and most hedges. A fund may look long a stock it's actually hedged against.</li>
  <li><strong>Cash, bonds (mostly), and foreign stocks</strong> not listed in the U.S.</li>
  <li><strong>Timing.</strong> A position reported for March 31 might have been bought in January or sold on April 1. By the filing date, it can be 45 to 135 days old.</li>
  <li><strong>Why</strong> they own it, their target price, or their cost.</li>
  <li>Some positions can be kept confidential for a time with SEC permission.</li>
</ul>

<h2>How to use 13Fs well</h2>
<ul>
  <li><strong>Follow managers with long, concentrated, low-turnover styles.</strong> A value investor who holds 15 stocks for years tells you more than a quant fund with 3,000 positions turning over every month.</li>
  <li><strong>Watch new positions and big adds.</strong> A brand-new 5% position is a statement of conviction.</li>
  <li><strong>Look for overlap.</strong> Several respected managers buying the same company over the same quarters.</li>
  <li><strong>Track multiple quarters.</strong> A position held and added to for 6 quarters means more than one quarter's buy.</li>
  <li><strong>Calculate weight in the portfolio,</strong> not just dollar size. $50M is huge for a $500M fund and trivial for a $500B one.</li>
</ul>
<div class="key"><b>Key idea</b>Research on "cloning" high-conviction 13F positions has found some value in copying the top holdings of skilled long-term managers. The edge comes from their stock selection, which is why it works best with patient managers whose ideas stay valid for years.</div>

<h2>Combining signals</h2>
<p>The strongest setups in your tracker are when independent signals line up with your own fundamentals work:</p>
<div class="tbl"><table>
  <thead><tr><th>Setup</th><th>Strength</th></tr></thead>
  <tbody>
    <tr><td>Insider cluster buy + respected fund adding + fundamentals pass your memo</td><td>Strongest</td></tr>
    <tr><td>Insider CEO buy + fundamentals pass</td><td>Strong</td></tr>
    <tr><td>One 13F new position + fundamentals pass</td><td>Moderate</td></tr>
    <tr><td>Congressional buy alone</td><td>Weak; research lead only</td></tr>
    <tr><td>Any signal + fundamentals fail</td><td>Pass</td></tr>
  </tbody>
</table></div>`,

{
  id: "4-4", phase: 4, num: "4.4", title: "From signal to decision",
  lede: "A repeatable checklist turns your tracker from a source of hot tips into a research pipeline. Backtesting tells you which signals deserve your attention.",
  minutes: 18,
  body: `
<h2>The six-step checklist</h2>
<p>Run every tracker alert through these steps before you act. Build them into your tracker as fields you must fill in.</p>
<ol>
  <li><strong>Who traded, and what's their edge?</strong> CEO vs director vs a congressional spouse vs a fund manager.</li>
  <li><strong>Is it conviction or routine?</strong> Open-market buy with personal money, or an option exercise, plan sale, or annual habit?</li>
  <li><strong>Is it confirmed?</strong> Several insiders, a respected fund adding, or another independent signal.</li>
  <li><strong>Do the fundamentals pass?</strong> Healthy cash flow, sensible debt, reasonable valuation, a moat. Write at least a short memo.</li>
  <li><strong>Does it fit your IPS?</strong> Position size, industry limits, satellite budget.</li>
  <li><strong>Journal it.</strong> Thesis, expected outcome, "sell if" rule, review date.</li>
</ol>
<div class="key"><b>Key idea</b>Step 4 is non-negotiable. A signal can get a company onto your research list. Only your analysis can get it into your portfolio.</div>

<h2>Backtesting: testing a signal on history</h2>
<p>Before trusting a signal, check how it would have done in the past. A simple backtest:</p>
<ol>
  <li>Define the signal precisely, for example "CEO or CFO open-market buy over $100,000, not under a 10b5-1 plan."</li>
  <li>Collect every instance over several years (more is better; aim for 100+).</li>
  <li>For each, record the stock's return over 3, 6, and 12 months starting from the <strong>filing date</strong>.</li>
  <li>Compare to the S&P 500 (or a small-cap index for small companies) over the same periods.</li>
  <li>Look at the average, the median, and the percent that beat the index.</li>
</ol>

<h2>Backtesting traps</h2>
<div class="tbl"><table>
  <thead><tr><th>Trap</th><th>What goes wrong</th><th>Avoid it by</th></tr></thead>
  <tbody>
    <tr><td><strong>Look-ahead bias</strong></td><td>Using information you wouldn't have had yet, like the trade date instead of the filing date</td><td>Always start the clock when the data became public</td></tr>
    <tr><td><strong>Survivorship bias</strong></td><td>Only testing companies that still exist; the bankrupt ones vanished from your data</td><td>Use data that includes delisted stocks</td></tr>
    <tr><td><strong>Small samples</strong></td><td>Ten great trades look like a pattern but could be luck</td><td>Use many instances over different market conditions</td></tr>
    <tr><td><strong>Ignoring costs</strong></td><td>Spreads on small caps eat returns</td><td>Subtract realistic trading costs</td></tr>
    <tr><td><strong>Overfitting</strong></td><td>Tweaking rules until the past looks perfect</td><td>Decide rules first, then test once; check on a separate time period</td></tr>
    <tr><td><strong>Averages hiding outliers</strong></td><td>One 500% winner makes the average look great</td><td>Check the median and win rate too</td></tr>
  </tbody>
</table></div>

<h2>Measure yourself</h2>
<p>Every 6 months, compare your satellite stocks (with dividends) to what the same money would have earned in an S&P 500 fund. Be honest. If the signals plus your research beat the index over 3 or more years, you have evidence of skill. If not, the core-and-satellite structure means you've only given up a little.</p>`,

  <li>Write down which trap is most likely affecting your result.</li>
</ol>
<p>This completes <strong>Milestone 4</strong>.</p>`,

{
  id: "4-5", phase: 4, num: "4.5", title: "Compliance and ethics",
  lede: "Using public filings is completely legal. Crossing into non-public information, or giving advice without a license, is not. Learn the lines now, because they get stricter once you work at a firm.",
  minutes: 15,
  body: `
<h2>Insider trading: the actual law</h2>
<p><strong>Insider trading</strong> means trading while aware of <strong>material, non-public information (MNPI)</strong> obtained in breach of a duty of trust. It's prosecuted under SEC Rule 10b-5.</p>
<ul>
  <li><strong>Material:</strong> a reasonable investor would consider it important (earnings before release, a pending merger, a failed drug trial).</li>
  <li><strong>Non-public:</strong> not yet broadly released.</li>
  <li><strong>Tipping:</strong> passing MNPI to someone who trades is illegal for both the tipper and the person who trades (the tippee), if the tippee knew or should have known it came from a breach.</li>
  <li>Penalties include prison, fines up to three times the profit gained or loss avoided, and lifetime industry bans.</li>
</ul>
<div class="key"><b>Key idea</b>Everything in your tracker (Form 4s, 13Fs, congressional disclosures, 10-Ks) is public. Acting on it is legal. If a friend who works at a company tells you about unannounced earnings, that's MNPI. Don't trade, and don't pass it on.</div>

<h2>When sharing picks makes you an "investment adviser"</h2>
<p>Under the Investment Advisers Act of 1940 and state law, someone who, <strong>for compensation</strong>, is <strong>in the business</strong> of advising others about <strong>securities</strong> is generally an investment adviser and must register. Charging for your tracker's picks, running a paid newsletter with personalized advice, or managing friends' money for a cut can all cross the line.</p>
<p>There's a "publisher's exclusion" for bona fide publications that give general, impersonal commentary on a regular schedule, but the line is easy to cross. Keep the tracker personal until you're licensed and under a firm's supervision.</p>

<h2>Rules that apply once you join a firm</h2>
<ul>
  <li><strong>Outside accounts (FINRA Rule 3210):</strong> you need your firm's written consent to hold a brokerage account at another firm, and the firm gets copies of statements.</li>
  <li><strong>Outside business activities (Rule 3270):</strong> you must give your firm written notice before any outside paid activity. Your tracker, if it ever earns money or is shared publicly, likely counts.</li>
  <li><strong>Private securities transactions (Rule 3280):</strong> no "selling away," meaning investments outside the firm without approval.</li>
  <li><strong>Personal trading policies:</strong> firms often require pre-clearance, holding periods, and ban trading ahead of client orders (<strong>front running</strong>).</li>
  <li><strong>Communications (Rule 2210):</strong> social media posts about investments are regulated communications. No promises, no cherry-picked performance.</li>
</ul>

<h2>Ethics beyond the rules</h2>
<p>An advisor's whole business rests on trust. The CFP Board's code puts it simply: act in the client's best interest, be honest, disclose conflicts, and keep information confidential. The habits you build now, like writing down your reasoning and not chasing tips, are the same habits that keep advisors out of trouble.</p>`,
  exercise: `<ol>
  <li>Write a one-paragraph "personal use" policy for your tracker: who can see it, that it's for your own research, and that it isn't advice.</li>
  <li>List any situation where you might come across MNPI through work or friends, and write how you'd handle it.</li>
</ol>`,

    { q: "A tippee who trades on MNPI they know came from a breach of duty is:", o: ["Fine, only the tipper is liable", "Also liable for insider trading", "Only liable if they lose money", "Protected by the STOCK Act"], a: 1, why: "Both tipper and tippee can be liable." },

{
  id: "5-1", phase: 5, num: "5.1", title: "The licensing map",
  lede: "You can't legally work as a financial advisor or run a branch without licenses. Here's exactly which ones, in what order, and what each lets you do.",
  minutes: 12,
  body: `
<h2>Who regulates who</h2>
<ul>
  <li><strong>Registered representatives</strong> (brokers) work for broker-dealers, earn commissions on transactions, and are regulated by <strong>FINRA</strong> and the SEC.</li>
  <li><strong>Investment adviser representatives (IARs)</strong> give advice for a fee, work for registered investment advisers, and are regulated by the <strong>states</strong> (and the SEC for larger firms).</li>
  <li>Most advisors at firms like Edward Jones are <strong>dually registered</strong>: they can do both, which is why they need both FINRA and state exams.</li>
</ul>

<h2>The exams</h2>
<div class="tbl"><table>
  <thead><tr><th>Exam</th><th>Owner</th><th>Allows</th><th>Sponsor?</th><th>Format (approx.)</th><th>Fee (approx.)</th></tr></thead>
  <tbody>
    <tr><td><strong>SIE</strong></td><td>FINRA</td><td>Nothing alone; entry exam paired with a rep exam</td><td>No</td><td>75 scored Qs, 1h45m, pass 70%</td><td class="n">$80</td></tr>
    <tr><td><strong>Series 7</strong></td><td>FINRA</td><td>Sell nearly all securities as a registered rep</td><td>Yes</td><td>125 Qs, 3h45m, pass 72%</td><td class="n">$300</td></tr>
    <tr><td><strong>Series 63</strong></td><td>NASAA</td><td>State registration as a securities agent</td><td>Yes</td><td>60 scored Qs, 1h15m, pass 72%</td><td class="n">$147</td></tr>
    <tr><td><strong>Series 65</strong></td><td>NASAA</td><td>Fee-based advice as an IAR</td><td>Usually via firm</td><td>130 scored Qs, 3h, pass about 72%</td><td class="n">$187</td></tr>
    <tr><td><strong>Series 66</strong></td><td>NASAA</td><td>Combines 63 and 65; needs the Series 7 too</td><td>Yes</td><td>100 scored Qs, 2h30m, pass 73%</td><td class="n">$177</td></tr>
    <tr><td><strong>Life and health insurance</strong></td><td>Your state</td><td>Sell life insurance, annuities, long-term care</td><td>Varies</td><td>State exam</td><td class="n">$50 to $150</td></tr>
  </tbody>
</table></div>
<p>Formats and fees are approximate. Confirm on finra.org and nasaa.org before you register.</p>

<h2>The typical path to running an Edward Jones branch</h2>
<ol>
  <li><strong>Now:</strong> pass the SIE on your own. It's valid for 4 years and shows recruiters you're serious.</li>
  <li><strong>Get hired</strong> into the firm's financial advisor training program. The firm becomes your sponsor.</li>
  <li><strong>Series 7</strong>, then <strong>Series 66</strong> (or 63 plus 65), during your first months of training. The firm typically provides study materials and time to prepare.</li>
  <li><strong>State insurance licenses</strong> so you can offer annuities and life insurance.</li>
  <li><strong>Build your branch:</strong> at Edward Jones, new advisors typically open and grow their own office in a community.</li>
  <li><strong>Optional later:</strong> CFP certification, usually in years 2 to 5.</li>
</ol>
<div class="key"><b>Key idea</b>The SIE is the only exam you can take before a firm hires you. Everything else in this phase prepares you to pass the rest quickly once you're sponsored.</div>

<h2>Keeping your licenses</h2>
<ul>
  <li>If you leave the industry, FINRA exams generally stay valid for 2 years (the SIE for 4). FINRA's Maintaining Qualifications Program can extend that to 5 years with yearly continuing education.</li>
  <li>Registered reps complete FINRA's annual Regulatory Element continuing education, plus their firm's own training.</li>
  <li>Your record, including any complaints, is public on <strong>FINRA BrokerCheck</strong>.</li>
</ul>`,

  <li>Look up three advisors in your area on <a href="https://brokercheck.finra.org/" target="_blank" rel="noopener">BrokerCheck</a>. Note which exams each passed and how long they've been registered.</li>
  <li>Set a target date for your SIE about 8 weeks out.</li>
</ol>`,

{
  id: "5-2", phase: 5, num: "5.2", title: "SIE core content",
  lede: "The SIE tests the basics every industry professional needs. Phases 1 to 3 already covered much of it. This lesson fills the gaps and shows how it's tested.",
  minutes: 22,
  body: `
<h2>The four sections</h2>
<div class="tbl"><table>
  <thead><tr><th>Section</th><th>Share of exam (approx.)</th><th>Covered where</th></tr></thead>
  <tbody>
    <tr><td>Knowledge of capital markets</td><td class="n">16%</td><td>This lesson; 1.6</td></tr>
    <tr><td>Understanding products and their risks</td><td class="n">44%</td><td>1.5, 3.1, 3.2, this lesson</td></tr>
    <tr><td>Trading, customer accounts, and prohibited activities</td><td class="n">31%</td><td>1.6, this lesson</td></tr>
    <tr><td>Overview of the regulatory framework</td><td class="n">9%</td><td>1.6, 4.5, this lesson</td></tr>
  </tbody>
</table></div>

<h2>Capital markets</h2>
<ul>
  <li><strong>Primary market:</strong> new securities sold to investors for the first time (IPOs). Proceeds go to the issuer. <strong>Secondary market:</strong> investors trading with each other.</li>
  <li><strong>Securities Act of 1933:</strong> governs new issues. Requires registration and a <strong>prospectus</strong>. Exempt: Treasuries, munis, and private placements (Regulation D) to accredited investors.</li>
  <li><strong>Securities Exchange Act of 1934:</strong> governs secondary trading, created the SEC, and regulates broker-dealers and exchanges.</li>
  <li><strong>Underwriting:</strong> investment banks buy an issue and resell it. Firm commitment (bank takes the risk) vs best efforts (bank just tries).</li>
  <li><strong>Economic factors:</strong> the Federal Reserve sets monetary policy (raising rates to fight inflation, cutting to support growth). GDP, CPI, and unemployment are key indicators. The business cycle runs expansion, peak, contraction, trough.</li>
</ul>

<h2>Products you need to know beyond Phase 1</h2>
<ul>
  <li><strong>Options basics:</strong> a call gives the right to buy, a put the right to sell, at the strike price until expiration. Buyers pay a premium and can lose only that premium. Covered in depth in 5.3.</li>
  <li><strong>Packaged products:</strong> mutual funds (open-end), closed-end funds (fixed shares, trade on exchanges), unit investment trusts, ETFs, variable annuities, REITs.</li>
  <li><strong>Direct participation programs (DPPs):</strong> limited partnerships where income and losses pass through to investors. Illiquid.</li>
  <li><strong>Municipal fund securities:</strong> 529 college savings plans and ABLE accounts for people with disabilities.</li>
  <li><strong>Money market instruments:</strong> T-bills, commercial paper, CDs, banker's acceptances. Short-term, maturing in a year or less.</li>
</ul>

<h2>Risks the SIE loves</h2>
<div class="tbl"><table>
  <thead><tr><th>Risk</th><th>Plain meaning</th></tr></thead>
  <tbody>
    <tr><td>Systematic / market</td><td>Whole market falls; can't diversify away</td></tr>
    <tr><td>Business / unsystematic</td><td>One company fails</td></tr>
    <tr><td>Liquidity</td><td>Can't sell quickly without a big discount</td></tr>
    <tr><td>Purchasing power / inflation</td><td>Fixed payments buy less over time</td></tr>
    <tr><td>Reinvestment</td><td>Coupons must be reinvested at lower rates</td></tr>
    <tr><td>Political / legislative</td><td>Laws change the investment's value (e.g., tax changes for munis)</td></tr>
    <tr><td>Currency</td><td>Foreign investments lose value when the dollar rises</td></tr>
  </tbody>
</table></div>

<h2>Customer accounts</h2>
<ul>
  <li><strong>Account types:</strong> individual, joint (JTWROS passes to the survivor; tenants in common passes to the estate), custodial (UTMA/UGMA for minors), trust, corporate, retirement.</li>
  <li><strong>Customer identification:</strong> name, date of birth, address, and ID number are required for every account.</li>
  <li><strong>Discretion:</strong> trading without asking the client first requires written authorization.</li>
  <li><strong>Margin:</strong> Regulation T requires 50% initial deposit on stock purchases.</li>
</ul>

<h2>Prohibited activities</h2>
<ul>
  <li><strong>Churning:</strong> excessive trading to generate commissions.</li>
  <li><strong>Front running:</strong> trading ahead of a client order.</li>
  <li><strong>Insider trading</strong> and <strong>market manipulation</strong> (pump and dump, spreading false rumors).</li>
  <li><strong>Selling away:</strong> selling investments not approved by your firm.</li>
  <li><strong>Guaranteeing</strong> a client against loss, and <strong>sharing in client accounts</strong> without permission.</li>
  <li><strong>Commingling</strong> client and firm money.</li>
</ul>

<h2>Anti-money laundering (AML)</h2>
<p>Money laundering has three stages: <strong>placement</strong> (cash enters the system), <strong>layering</strong> (moved around to hide its source), and <strong>integration</strong> (comes back looking legitimate). Firms file a <strong>Currency Transaction Report</strong> for cash over $10,000 in a day and a <strong>Suspicious Activity Report</strong> (generally $5,000 or more) for suspicious activity. Never tell a customer a SAR was filed.</p>`,

  <li>Make flashcards for every term in this lesson you couldn't define from memory.</li>
</ol>`,

  <tbody>
    <tr><td>Buy a call</td><td>Bullish</td><td>Unlimited</td><td>Premium paid</td><td class="n">Strike + premium</td></tr>
    <tr><td>Sell (write) a call</td><td>Bearish or neutral</td><td>Premium received</td><td>Unlimited (if uncovered)</td><td class="n">Strike + premium</td></tr>
    <tr><td>Buy a put</td><td>Bearish</td><td>Strike − premium</td><td>Premium paid</td><td class="n">Strike − premium</td></tr>
    <tr><td>Sell (write) a put</td><td>Bullish or neutral</td><td>Premium received</td><td>Strike − premium</td><td class="n">Strike − premium</td></tr>
  </tbody>
</table></div>
<div class="example"><b class="t">Worked example</b>You buy 1 XYZ Jan 50 call for a premium of 3. One contract covers 100 shares, so you pay $300. Breakeven is 50 + 3 = $53. If XYZ rises to $60, the call is worth at least $10 (intrinsic value), so you make (10 − 3) × 100 = $700. If XYZ stays below $50, the call expires worthless and you lose $300.</div>
<ul>
  <li><strong>In the money:</strong> a call when stock price is above strike; a put when stock price is below strike.</li>
  <li><strong>Premium = intrinsic value + time value.</strong></li>
  <li><strong>Covered call:</strong> own 100 shares and sell a call. Earns income, caps upside. A conservative strategy.</li>
  <li><strong>Protective put:</strong> own shares and buy a put. Insurance against a drop.</li>
  <li>Customers must receive the Options Disclosure Document and get approval before trading options, and sign an options agreement within 15 days of approval.</li>
</ul>

<h2>Municipal bonds</h2>
<ul>
  <li><strong>General obligation (GO) bonds:</strong> backed by the issuer's taxing power. Usually need voter approval.</li>
  <li><strong>Revenue bonds:</strong> repaid from a specific project's income (toll roads, airports, hospitals). Analysts check the debt service coverage ratio.</li>
  <li>Interest is usually exempt from federal tax, and from state tax for in-state residents.</li>
</ul>
<p class="formula">Tax-equivalent yield = Muni yield ÷ (1 − tax bracket)</p>
<div class="example"><b class="t">Worked example</b>A client in the 32% bracket is choosing between a 4% muni and a 5.5% corporate bond. Tax-equivalent yield = 4% ÷ 0.68 = 5.88%. The muni pays more after tax. A client in the 12% bracket gets only 4% ÷ 0.88 = 4.55%, so the corporate wins. That's why munis suit high-bracket clients, and recommending them to low-bracket clients is unsuitable.</div>

<h2>Margin math</h2>
<ul>
  <li><strong>Initial requirement:</strong> 50% under Reg T, with a minimum equity of $2,000 to open a margin account.</li>
  <li><strong>Maintenance:</strong> FINRA minimum of 25% equity for long positions. Below that, a margin call.</li>
  <li><strong>Equity</strong> = market value − debit balance (the loan).</li>
</ul>
<div class="example"><b class="t">Worked example</b>A client buys $20,000 of stock on margin, depositing $10,000 and borrowing $10,000. If the stock falls to $13,000, equity = $13,000 − $10,000 = $3,000, which is 23% of market value. That's below 25%, so the client gets a maintenance call. The value at which a call hits = debit ÷ 0.75 = $13,333.</div>

<h2>Suitability and recommendations</h2>
<p>Before recommending anything, a rep must know the client's investment profile: age, other investments, financial situation, tax status, objectives, experience, time horizon, liquidity needs, and risk tolerance. Exam questions often describe a client and ask for the <em>most</em> suitable choice. Match the product to the stated objective:</p>
<div class="tbl"><table>
  <thead><tr><th>Objective</th><th>Suitable</th></tr></thead>
  <tbody>
    <tr><td>Preservation of capital</td><td>Treasuries, CDs, money market funds</td></tr>
    <tr><td>Income</td><td>Bonds, dividend stocks, preferred stock, REITs</td></tr>
    <tr><td>Growth</td><td>Common stocks, growth funds</td></tr>
    <tr><td>Speculation</td><td>Options, small caps, high-yield bonds</td></tr>
    <tr><td>Tax-free income</td><td>Municipal bonds (high brackets only)</td></tr>
  </tbody>
</table></div>

<h2>Mutual fund sales practices</h2>
<ul>
  <li><strong>Breakpoints:</strong> reduced sales charges at set investment levels. A <strong>letter of intent</strong> lets a client get the breakpoint by promising to invest the amount within 13 months. <strong>Rights of accumulation</strong> count existing holdings toward breakpoints.</li>
  <li><strong>Breakpoint selling</strong> (recommending just under a breakpoint) is prohibited.</li>
  <li>Switching between fund families to generate new sales charges is a red flag.</li>
</ul>`,
  exercise: `<ol>
  <li>Work through 10 options problems of your own: pick a stock, strike, and premium, and calculate max gain, max loss, and breakeven for buying and writing both a call and a put.</li>
  <li>Calculate tax-equivalent yields for a 3.5% muni at the 12%, 22%, 32%, and 37% brackets.</li>
  <li>Write three short client descriptions and the single most suitable investment for each.</li>
</ol>`,
  quiz: [
    { q: "An investor buys a 40 put for 2. Breakeven is:", o: ["$38", "$40", "$42", "$2"], a: 0, why: "Put breakeven = strike − premium = 40 − 2 = 38." },
    { q: "The maximum loss for an uncovered (naked) call writer is:", o: ["The premium", "The strike price", "Unlimited", "Zero"], a: 2, why: "The stock can rise without limit, so losses are unlimited." },
    { q: "A 3% muni for a client in the 40% combined bracket has a tax-equivalent yield of:", o: ["3.0%", "4.2%", "5.0%", "7.5%"], a: 2, why: "3% ÷ (1 − 0.40) = 5.0%." },
    { q: "Which bond is backed by the issuer's full taxing power?", o: ["Revenue bond", "General obligation bond", "Corporate debenture", "Mortgage-backed security"], a: 1, why: "GO bonds are backed by taxes." },
    { q: "A margin account has a market value of $30,000 and a debit of $18,000. Equity is:", o: ["$12,000", "$18,000", "$30,000", "$48,000"], a: 0, why: "Equity = $30,000 − $18,000 = $12,000." },
    { q: "Which strategy best protects a stock owner from a price drop?", o: ["Writing a covered call", "Buying a protective put", "Selling a naked put", "Buying more on margin"], a: 1, why: "A protective put sets a floor on losses." },
    { q: "A letter of intent lets a client receive a breakpoint if they invest the full amount within:", o: ["30 days", "90 days", "13 months", "5 years"], a: 2, why: "LOIs cover 13 months and can be backdated up to 90 days." }
  ],

{
  id: "5-4", phase: 5, num: "5.4", title: "Series 66 and state law",
  lede: "The Series 66 is mostly about rules: who must register, what counts as unethical, and the fiduciary duty advisers owe clients. About 45% of the exam is law and ethics.",
  minutes: 22,
  body: `
<h2>How the exam is weighted</h2>
<div class="tbl"><table>
  <thead><tr><th>Section</th><th>Share (approx.)</th></tr></thead>
  <tbody>
    <tr><td>Economic factors and business information</td><td class="n">5%</td></tr>
    <tr><td>Investment vehicle characteristics</td><td class="n">20%</td></tr>
    <tr><td>Client investment recommendations and strategies</td><td class="n">30%</td></tr>
    <tr><td>Laws, regulations, and guidelines, including prohibition on unethical business practices</td><td class="n">45%</td></tr>
  </tbody>
</table></div>

<h2>The Uniform Securities Act: the four players</h2>
<p>Most state securities laws are based on the <strong>Uniform Securities Act</strong>. It defines four roles, and the exam asks constantly whether someone fits a definition or an exclusion.</p>
<div class="tbl"><table>
  <thead><tr><th>Role</th><th>Definition</th><th>Not included</th></tr></thead>
  <tbody>
    <tr><td><strong>Broker-dealer</strong></td><td>A firm in the business of buying and selling securities for others or itself</td><td>Agents, issuers, banks; firms with no in-state office dealing only with other broker-dealers or institutions</td></tr>
    <tr><td><strong>Agent</strong></td><td>An individual who represents a broker-dealer or issuer in selling securities</td><td>Clerical staff; someone representing an issuer in exempt transactions without special pay</td></tr>
    <tr><td><strong>Investment adviser</strong></td><td>Anyone who, for compensation, is in the business of advising others about securities</td><td>Banks, lawyers, accountants, teachers, and engineers whose advice is incidental; publishers of general newspapers</td></tr>
    <tr><td><strong>Investment adviser representative</strong></td><td>An individual employed by an adviser who gives advice, manages accounts, or supervises those who do</td><td>Clerical staff</td></tr>
  </tbody>
</table></div>
<p>The "LATE" exclusion for advisers: <strong>L</strong>awyers, <strong>A</strong>ccountants, <strong>T</strong>eachers, and <strong>E</strong>ngineers, when advice is solely incidental and not specially charged for.</p>

<h2>State vs SEC registration for advisers</h2>
<ul>
  <li>Advisers with roughly <strong>$110 million or more</strong> under management register with the SEC (federal covered advisers). Those under $100 million generally register with their state. Between $100M and $110M they may choose.</li>
  <li>Federal covered advisers still <strong>notice file</strong> with states and pay fees, and their IARs register in the states where they have a place of business.</li>
  <li><strong>De minimis:</strong> an adviser with no place of business in a state and 5 or fewer non-institutional clients there in 12 months doesn't need to register in that state.</li>
  <li>State registration generally becomes effective at noon on the 30th day after filing, unless the administrator acts sooner.</li>
</ul>

<h2>Fiduciary duty</h2>
<p>Investment advisers are <strong>fiduciaries</strong>. They owe clients a duty of care (advice in the client's best interest, based on a reasonable understanding of their situation) and a duty of loyalty (put the client first and disclose all material conflicts).</p>

<h2>Advisory contracts and disclosure</h2>
<ul>
  <li>Contracts must be in writing and state the services, fees, length, and whether the adviser has discretion.</li>
  <li><strong>No assignment</strong> of the contract to another adviser without client consent.</li>
  <li><strong>Performance-based fees</strong> are allowed only for "qualified clients" who meet higher wealth thresholds.</li>
  <li><strong>Form ADV Part 2</strong> (the brochure) must be delivered at least 48 hours before signing, or at signing with a 5-business-day right to cancel without penalty.</li>
  <li><strong>Custody</strong> of client funds brings extra rules: qualified custodians, account statements, and surprise audits.</li>
</ul>

<h2>Unethical business practices (heavily tested)</h2>
<ul>
  <li>Recommending unsuitable investments or trading excessively.</li>
  <li>Guaranteeing against loss or promising specific results.</li>
  <li>Borrowing money from or lending to clients (unless the client is a financial institution or immediate family, per rules).</li>
  <li>Misrepresenting qualifications, such as implying government approval ("registered with the state" doesn't mean "approved by the state").</li>
  <li>Using testimonials or cherry-picked performance in misleading ways.</li>
  <li>Failing to disclose conflicts, such as receiving commissions on recommended products.</li>
  <li>Exercising discretion without written authorization (time and price discretion for that day is the narrow exception).</li>
</ul>

<h2>Administrator powers</h2>
<p>The state <strong>Administrator</strong> can deny, suspend, or revoke registrations, issue subpoenas, and stop orders. Penalties for willful violations can include fines and prison. Clients who buy securities through a violation can sue to get their money back plus interest and legal fees ("civil liability"), generally within 2 years of discovering the violation or 3 years of the sale.</p>`,
  exercise: `<ol>
  <li>Download the NASAA Series 66 content outline and NASAA's Statement of Policy on unethical business practices for advisers (both free).</li>
  <li>Write five "Is this person an investment adviser?" scenarios with answers, using the definitions and LATE exclusion.</li>
  <li>Make flashcards for each unethical practice listed above.</li>
</ol>`,
  quiz: [
    { q: "An accountant gives investment advice only as part of tax preparation and charges no separate fee. Under the USA, they are:", o: ["An investment adviser", "Excluded from the definition", "An agent", "A broker-dealer"], a: 1, why: "The LATE exclusion covers incidental advice with no special compensation." },
    { q: "An adviser with $250 million under management generally registers with:", o: ["Every state", "The SEC", "FINRA only", "No one"], a: 1, why: "Advisers above about $110M register with the SEC as federal covered advisers." },
    { q: "An advisory contract can be assigned to another adviser:", o: ["Freely", "Only with client consent", "Never", "Only by the state"], a: 1, why: "Assignment requires the client's consent." },
    { q: "Which statement is permitted?", o: ["'Our firm is approved by the state'", "'Our firm is registered with the state'", "'Your principal is guaranteed'", "'This stock will double'"], a: 1, why: "Stating registration is fine; implying approval or guarantees is prohibited." },
    { q: "Performance-based fees are allowed for:", o: ["Any client", "Qualified clients only", "No clients", "Clients under 30"], a: 1, why: "Only clients meeting 'qualified client' thresholds." },
    { q: "If the ADV Part 2 brochure is delivered at signing, the client may cancel without penalty within:", o: ["24 hours", "48 hours", "5 business days", "30 days"], a: 2, why: "Delivery at signing gives a 5-business-day cancellation right." }
  ],
  deeper: `<a href="https://www.nasaa.org/exams/" target="_blank" rel="noopener">NASAA exam outlines</a>. Most Series 66 failures come from the law section, so drill practice questions there.`
},
{
  id: "5-5", phase: 5, num: "5.5", title: "Insurance licenses and the CFP",
  lede: "Advisors at full-service firms sell insurance and annuities alongside investments. The CFP is the optional credential that marks a true financial planner.",
  minutes: 18,
  body: `
<h2>Life and health insurance licenses</h2>
<p>Each state issues its own insurance licenses. Advisors usually get a <strong>life</strong> license (life insurance and annuities) and often <strong>health</strong> (disability and long-term care). Variable annuities and variable life require both an insurance license and a securities license.</p>

<h2>Types of life insurance</h2>
<div class="tbl"><table>
  <thead><tr><th>Type</th><th>How it works</th><th>Best for</th></tr></thead>
  <tbody>
    <tr><td><strong>Term</strong></td><td>Pays a death benefit only if you die during the term (10, 20, 30 years). Cheapest.</td><td>Covering income while kids are young or a mortgage is unpaid. Most families.</td></tr>
    <tr><td><strong>Whole life</strong></td><td>Permanent coverage with fixed premiums and a guaranteed cash value</td><td>Estate planning, lifelong needs. Much more expensive.</td></tr>
    <tr><td><strong>Universal life</strong></td><td>Permanent with flexible premiums and death benefit; cash value earns a credited rate</td><td>Those wanting flexibility</td></tr>
    <tr><td><strong>Variable universal life</strong></td><td>Cash value invested in subaccounts; can rise or fall</td><td>Higher earners comfortable with market risk</td></tr>
  </tbody>
</table></div>
<p>A common way to estimate need is the <strong>DIME</strong> method: <strong>D</strong>ebts + <strong>I</strong>ncome (years of replacement) + <strong>M</strong>ortgage + <strong>E</strong>ducation costs, minus existing assets.</p>

<h2>Annuity details</h2>
<ul>
  <li><strong>Accumulation phase:</strong> money grows tax-deferred. <strong>Annuitization:</strong> converted into a stream of payments.</li>
  <li><strong>Surrender charges</strong> apply for early withdrawals, often declining over 5 to 10 years.</li>
  <li>Withdrawals of earnings before 59½ generally face a 10% IRS penalty plus income tax.</li>
  <li>A <strong>1035 exchange</strong> moves one annuity or life policy into another tax-free. Regulators watch these closely because unnecessary exchanges reset surrender charges and generate commissions.</li>
</ul>
<div class="key"><b>Key idea</b>Annuities can be the right answer for retirees who fear running out of money. They can also be expensive and illiquid. Suitability rules for annuities are strict, and many complaints against advisors involve them.</div>

<h2>The CFP certification</h2>
<p>CERTIFIED FINANCIAL PLANNER™ is the most recognized planning credential. It isn't legally required, but many clients and firms value it, and firms like Edward Jones often help pay for it. The CFP Board requires four things:</p>
<ol>
  <li><strong>Education:</strong> a bachelor's degree (any field) plus CFP Board-registered coursework covering about 8 subjects, usually 12 to 18 months of study.</li>
  <li><strong>Exam:</strong> 170 multiple-choice questions across two 3-hour sessions. Pass rates have typically run around 60% to 65%.</li>
  <li><strong>Experience:</strong> 6,000 hours of professional experience, or 4,000 hours in an apprenticeship-style role.</li>
  <li><strong>Ethics:</strong> background check and commitment to the CFP Board's Code of Ethics, including a fiduciary duty when giving financial advice.</li>
</ol>
<p>CFP exam topics include professional conduct, financial planning principles, insurance and risk management, investments, tax planning, retirement and employee benefits, estate planning, and the psychology of financial planning. Costs are roughly $1,000 for the exam plus a few thousand dollars for coursework.</p>

<h2>Other credentials you'll hear about</h2>
<ul>
  <li><strong>ChFC:</strong> similar to the CFP, from The American College.</li>
  <li><strong>CFA:</strong> a demanding three-level program focused on investment analysis. Common for analysts and portfolio managers.</li>
  <li><strong>CRPC / AAMS:</strong> shorter designations focused on retirement planning and asset management.</li>
</ul>`,
  exercise: `<ol>
  <li>Look up your state's insurance department and find the life insurance license requirements: prelicensing education hours, exam fee, and testing provider.</li>
  <li>Use the DIME method to estimate your own life insurance need.</li>
  <li>Look at the CFP Board's list of registered education programs and note two online options and their costs.</li>
</ol>`,
  quiz: [
    { q: "Which type of life insurance is generally cheapest for a given death benefit?", o: ["Whole life", "Universal life", "Term life", "Variable universal life"], a: 2, why: "Term has no cash value and covers only a set period, so premiums are lowest." },
    { q: "Selling a variable annuity requires:", o: ["Only an insurance license", "Only a securities license", "Both insurance and securities licenses", "No license"], a: 2, why: "Variable products are both insurance and securities." },
    { q: "A tax-free exchange of one annuity for another is called a:", o: ["Rollover", "1035 exchange", "Wash sale", "Backdoor Roth"], a: 1, why: "Section 1035 of the tax code allows it." },
    { q: "Which is NOT one of the CFP Board's four requirements?", o: ["Education", "Exam", "Experience", "Holding a Series 7"], a: 3, why: "The four are Education, Exam, Experience, and Ethics. No FINRA license is required." },
    { q: "The DIME method estimates:", o: ["Bond duration", "Life insurance need", "Retirement income", "Mutual fund breakpoints"], a: 1, why: "Debts, Income, Mortgage, Education." }
  ],
  deeper: `CFP Board <a href="https://www.cfp.net/become-a-cfp-professional" target="_blank" rel="noopener">Become a CFP professional</a>; your state insurance department's licensing page.`
},

{
  id: "6-1", phase: 6, num: "6.1", title: "Reg BI and fiduciary duty",
  lede: "Two standards govern how advisors treat clients: Regulation Best Interest for brokerage recommendations, and fiduciary duty for advisory accounts. Knowing which applies, and when, is part of the job.",
  minutes: 16,
  body: `
<h2>Brokerage vs advisory accounts</h2>
<div class="tbl"><table>
  <thead><tr><th></th><th>Brokerage account</th><th>Advisory account</th></tr></thead>
  <tbody>
    <tr><td><strong>How you're paid</strong></td><td>Commissions per transaction</td><td>Ongoing fee, usually a % of assets (often around 1% a year, lower for larger accounts)</td></tr>
    <tr><td><strong>Standard</strong></td><td>Regulation Best Interest</td><td>Fiduciary duty under the Advisers Act</td></tr>
    <tr><td><strong>Monitoring</strong></td><td>No ongoing duty unless agreed</td><td>Ongoing monitoring is part of the service</td></tr>
    <tr><td><strong>Fits</strong></td><td>Buy-and-hold clients who trade rarely</td><td>Clients wanting ongoing management and planning</td></tr>
  </tbody>
</table></div>
<p>Edward Jones and similar firms offer both. Recommending the account type itself is a recommendation subject to these standards. Moving a buy-and-hold client into a fee account that costs them more, with little added service, is a classic problem ("reverse churning").</p>

<h2>Regulation Best Interest</h2>
<p>Since June 2020, broker-dealers must act in the retail customer's <strong>best interest</strong> when recommending securities or account types, without putting their own interest first. It has four obligations:</p>
<ol>
  <li><strong>Disclosure:</strong> tell clients, in writing, about fees, the scope of the relationship, and material conflicts.</li>
  <li><strong>Care:</strong> understand the product's risks, rewards, and costs, and have a reasonable basis to believe it's in this client's best interest. Consider reasonably available alternatives.</li>
  <li><strong>Conflict of interest:</strong> identify, disclose, and reduce conflicts. Eliminate sales contests and quotas based on specific products within limited time periods.</li>
  <li><strong>Compliance:</strong> written policies and procedures to make all of the above happen.</li>
</ol>

<h2>Form CRS</h2>
<p>Every broker-dealer and adviser serving retail investors must give a <strong>Form CRS (Client Relationship Summary)</strong>: a short, plain-English document (2 pages, or 4 for dual registrants) covering services, fees, conflicts, legal and disciplinary history, and questions clients should ask. Give it at or before the start of the relationship.</p>

<h2>Fiduciary duty for advisers</h2>
<p>Investment advisers owe a fiduciary duty for the entire relationship:</p>
<ul>
  <li><strong>Duty of care:</strong> give advice in the client's best interest, seek best execution, and monitor at a frequency fitting the relationship.</li>
  <li><strong>Duty of loyalty:</strong> don't put your interest ahead of the client's; fully and fairly disclose all material conflicts and get informed consent.</li>
</ul>
<div class="key"><b>Key idea</b>In practice, both standards lead to the same habits: know the client deeply, consider cheaper alternatives, document why your recommendation fits, and disclose anything that pays you more.</div>

<h2>Special situations</h2>
<ul>
  <li><strong>Rollovers:</strong> recommending a 401(k) rollover to an IRA is a high-scrutiny decision. Document the comparison of fees, investment options, and services.</li>
  <li><strong>Senior investors:</strong> FINRA Rule 2165 lets firms place temporary holds on disbursements when financial exploitation is suspected, and Rule 4512 requires asking for a trusted contact person.</li>
  <li><strong>Complex products:</strong> leveraged ETFs, non-traded REITs, and complex annuities draw extra scrutiny.</li>
</ul>`,
  exercise: `<ol>
  <li>Find and read the Form CRS for Edward Jones and two other firms. Compare fees, account types, and conflicts in a short table.</li>
  <li>Write the "best interest" documentation you'd keep for recommending a Roth IRA with an S&P 500 index fund to a 30-year-old.</li>
</ol>`,
  quiz: [

{
  id: "6-2", phase: 6, num: "6.2", title: "Planning beyond stocks",
  lede: "Clients don't come to an advisor for stock picks. They come with questions about retirement, Social Security, college, insurance, and what happens when they die.",
  minutes: 24,
  body: `
<h2>Retirement income</h2>
<p>The central question: how much can a client spend each year without running out? A common starting point is the <strong>4% rule</strong>, from William Bengen's 1994 research: withdraw 4% of the portfolio in year one, then adjust that dollar amount for inflation each year. Historically, that lasted at least 30 years in U.S. markets for balanced portfolios.</p>
<p class="formula">Needed savings ≈ Yearly spending from portfolio × 25</p>
<div class="example"><b class="t">Example</b>A couple needs $80,000 a year. Social Security will provide $45,000. The portfolio must supply $35,000, so they need about $35,000 × 25 = <strong>$875,000</strong>. Many planners now use flexible spending rules (spend less after bad years) instead of a fixed 4%.</div>

<h2>Social Security</h2>
<ul>
  <li><strong>Full retirement age (FRA)</strong> is 67 for anyone born in 1960 or later.</li>
  <li>Claiming at 62 cuts the benefit permanently by about 30%.</li>
  <li>Delaying past FRA adds 8% per year until 70, so claiming at 70 gives about 124% of the FRA benefit.</li>
  <li>Spouses can claim up to 50% of the other's FRA benefit; survivors receive the larger of the two benefits.</li>
  <li>Up to 85% of benefits can be taxable depending on other income.</li>
</ul>
<div class="key"><b>Key idea</b>Delaying Social Security is often the cheapest inflation-adjusted lifetime income a client can buy, especially for the higher earner in a married couple, since it also sets the survivor benefit.</div>

<h2>Tax-smart withdrawals</h2>
<ul>
  <li>A common order: taxable accounts first, then tax-deferred (traditional IRA/401k), then Roth last, letting Roth money grow tax-free longest. Advisors adjust this to fill low tax brackets each year.</li>
  <li><strong>Roth conversions</strong> in low-income years (early retirement before Social Security and RMDs) can reduce lifetime taxes.</li>
  <li><strong>Qualified charitable distributions:</strong> at 70½ and older, IRA money sent directly to charity counts toward RMDs without being taxed.</li>
</ul>

<h2>Education planning</h2>
<ul>
  <li><strong>529 plans:</strong> grow tax-free when used for qualified education costs (college, up to $10,000 a year of K–12 tuition, apprenticeships). Many states give a tax deduction for contributions.</li>
  <li>Unused 529 money can roll into a Roth IRA for the beneficiary, up to a $35,000 lifetime limit, if the 529 has been open at least 15 years (yearly Roth limits apply).</li>
  <li><strong>UTMA/UGMA</strong> custodial accounts become the child's property at the age of majority, which hurts financial aid more.</li>
</ul>

<h2>Risk management</h2>
<ul>
  <li><strong>Life insurance:</strong> covered in 5.5. Most young families need term coverage.</li>
  <li><strong>Disability insurance:</strong> replaces income if you can't work. More likely to be needed than life insurance during working years.</li>
  <li><strong>Long-term care:</strong> nursing and in-home care can cost over $100,000 a year. Options: traditional LTC insurance, hybrid life/LTC policies, or self-funding for the wealthy.</li>
  <li><strong>Umbrella liability:</strong> cheap extra protection for people with significant assets.</li>
</ul>

<h2>Estate planning basics</h2>
<div class="tbl"><table>
  <thead><tr><th>Document or tool</th><th>What it does</th></tr></thead>
  <tbody>
    <tr><td>Will</td><td>Directs who gets assets that go through probate; names guardians for minor children</td></tr>
    <tr><td>Revocable living trust</td><td>Holds assets during life and passes them outside probate, privately</td></tr>
    <tr><td>Beneficiary designations</td><td>On IRAs, 401(k)s, life insurance. They override the will, so keep them updated.</td></tr>
    <tr><td>Durable power of attorney</td><td>Lets someone handle finances if you're incapacitated</td></tr>
    <tr><td>Healthcare directive</td><td>Names who makes medical decisions and states your wishes</td></tr>
  </tbody>
</table></div>
<ul>
  <li>The federal estate tax exemption is $15 million per person for 2026 under current law, so it affects few families. Some states have much lower thresholds.</li>
  <li>Inherited assets in taxable accounts get a <strong>step-up in basis</strong> to the value at death, erasing the built-in capital gain.</li>
  <li>Most non-spouse heirs must empty an inherited IRA within <strong>10 years</strong> (the SECURE Act rule).</li>
</ul>`,
  exercise: `<p>Write a full sample financial plan for a made-up couple: both 55, household income $140,000, $400,000 in 401(k)s, $60,000 in a Roth, $30,000 in savings, a $180,000 mortgage, and one child starting college in 3 years. Cover retirement readiness (4% rule), Social Security claiming strategy, college funding, insurance gaps, and the estate documents they should have. Aim for 2 to 3 pages.</p>`,

    { q: "For someone born in 1965, full retirement age for Social Security is:", o: ["62", "65", "67", "70"], a: 2, why: "FRA is 67 for anyone born in 1960 or later." },
    { q: "Which overrides a will?", o: ["Nothing", "Beneficiary designations on an IRA", "A healthcare directive", "A brokerage statement"], a: 1, why: "Beneficiary designations control those accounts regardless of the will." },
    { q: "Most non-spouse beneficiaries must empty an inherited IRA within:", o: ["1 year", "5 years", "10 years", "Their lifetime"], a: 2, why: "The SECURE Act's 10-year rule." },

  minutes: 16,
  body: `
<h2>The reality of year one</h2>
<p>At firms like Edward Jones, new advisors typically start in a community with few or no clients and build from scratch. The firm provides training and usually a period of salary support that phases down as your own revenue grows. Industry-wide, many new advisors don't make it past their first few years. The ones who succeed treat prospecting like a daily job.</p>

<h2>Where clients come from</h2>
<ul>
  <li><strong>Face-to-face prospecting:</strong> Edward Jones built its model on advisors introducing themselves to people door to door in their community. It's still a big part of early training.</li>
  <li><strong>Local business owners:</strong> they need retirement plans (SEP, SIMPLE, 401k), insurance, and succession planning, and they know everyone.</li>
  <li><strong>Community involvement:</strong> chambers of commerce, Rotary, church, youth sports, school boards. Be useful first.</li>
  <li><strong>Referrals:</strong> eventually the largest source. Satisfied clients refer friends when you ask and when you do great work.</li>
  <li><strong>Centers of influence:</strong> CPAs, estate attorneys, and real estate agents who see clients' money events first.</li>
  <li><strong>Seminars and workshops:</strong> retirement planning, Social Security, and Medicare basics draw pre-retirees. Content must follow FINRA communications rules.</li>
</ul>

<h2>The first meeting</h2>
<ol>
  <li><strong>Listen first.</strong> Ask about goals, worries, family, work, and past experiences with money. Talk less than half the time.</li>
  <li><strong>Gather facts:</strong> the same client profile you built in Lesson 1.1, plus statements for existing accounts.</li>
  <li><strong>Set expectations:</strong> how you're paid, what services they get, how often you'll meet. Deliver Form CRS.</li>
  <li><strong>Agree on next steps:</strong> a second meeting to present recommendations.</li>
</ol>
<div class="key"><b>Key idea</b>Clients rarely leave advisors over returns. They leave because they feel ignored. Reliable, proactive contact matters more than a clever stock pick.</div>

<h2>Serving clients at scale</h2>
<ul>
  <li><strong>Segment your book:</strong> top clients get quarterly reviews and frequent contact; smaller accounts get annual reviews and efficient service.</li>
  <li><strong>Annual review checklist:</strong> goals changed? Beneficiaries current? Allocation still right? Tax opportunities? Insurance gaps?</li>
  <li><strong>Systems:</strong> a CRM to track contacts, birthdays, and to-dos. Your branch office administrator runs much of this.</li>
</ul>

<h2>Metrics advisors track</h2>
<div class="tbl"><table>
  <thead><tr><th>Metric</th><th>What it means</th></tr></thead>
  <tbody>
    <tr><td>Assets under care / management</td><td>Total client money you oversee. The main measure of a book's size.</td></tr>
    <tr><td>Gross revenue (production)</td><td>Commissions plus fees your book generates</td></tr>
    <tr><td>Fee-based percentage</td><td>Share of revenue from recurring fees, which is steadier than commissions</td></tr>
    <tr><td>Households served</td><td>Number of client families</td></tr>
    <tr><td>Net new assets</td><td>New money in minus money out. The best sign of growth.</td></tr>
    <tr><td>Client retention</td><td>Percent of households kept each year</td></tr>
  </tbody>
</table></div>`,

</ol>`,

<h2>What a branch looks like</h2>
<p>At Edward Jones, branches are typically small offices in neighborhoods and small towns, usually one financial advisor plus a <strong>branch office administrator (BOA)</strong>. Larger branches can have multiple advisors or an extra administrator. The advisor leads; the BOA handles operations, scheduling, paperwork, and much of the day-to-day client service.</p>

<h2>The business side</h2>
<ul>
  <li><strong>Revenue:</strong> commissions and advisory fees from your book. Fee-based revenue recurs; commission revenue depends on activity.</li>
  <li><strong>Expenses:</strong> rent, staff, technology, marketing, and community events. At firms like Edward Jones, the firm covers many of these and shares in branch profitability; the details vary and change, so ask during interviews.</li>
  <li><strong>Compensation:</strong> usually a share of the revenue you generate, plus bonuses tied to branch profitability and growth. Expect several lean years while the book grows.</li>
  <li><strong>Growth plan:</strong> set yearly targets for households, assets, and revenue, and track monthly.</li>
</ul>

<h2>Managing your BOA</h2>
<ul>
  <li>Hire for reliability, warmth with clients, and attention to detail.</li>
  <li>Give them ownership of processes: account opening, scheduling reviews, client follow-ups.</li>
  <li>Weekly planning meetings. A great BOA can roughly double the clients an advisor can serve well.</li>
</ul>

<h2>Compliance in daily life</h2>
<ul>
  <li>Keep records of every recommendation and why it was suitable or in the client's best interest.</li>
  <li>Get approval for marketing, seminars, and social media posts.</li>
  <li>Report complaints, outside business activities, and outside accounts to the firm.</li>
  <li>Complete annual continuing education.</li>
  <li>Never handle client cash or checks outside firm procedures.</li>
</ul>

<h2>Your weekly rhythm</h2>
<div class="tbl"><table>
  <thead><tr><th>Activity</th><th>Early career</th><th>Established</th></tr></thead>

    <tr><td>Admin, compliance, team management</td><td class="n">10%</td><td class="n">15% to 20%</td></tr>

<p>These splits are illustrative, to show how the job shifts over time.</p>

<h2>Getting hired</h2>
<ol>

</ol>

/* ---------- state ---------- */
const STORE = "advisor-track-v1";
function load() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
function save(s) { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {} }
let state = load();
state.done = state.done || {};

const $ = (id) => document.getElementById(id);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmt = (n) => "$" + Math.round(n).toLocaleString("en-US");

function renderNav(curId) {
  const nav = $("nav");
  nav.innerHTML = PHASES.map(p => {
    const ls = LESSONS.filter(l => l.phase === p.id);
    const items = ls.map(l => `<li><a href="#l-${l.id}" class="${l.id === curId ? "on" : ""}"${l.id === curId ? ' aria-current="page"' : ""}><span class="num">${l.num}</span><span>${l.title}</span><span class="tick">${state.done[l.id] ? "✓" : ""}</span></a></li>`).join("");
    return `<div class="phase"><h3><span>${p.title}</span><em>${ls.filter(l => state.done[l.id]).length}/${ls.length}</em></h3><ol>${items}</ol></div>`;
  }).join("");
  const n = LESSONS.filter(l => state.done[l.id]).length;
  $("meterBar").style.width = (n / LESSONS.length * 100) + "%";
  $("meterLabel").textContent = `${n} of ${LESSONS.length} lessons complete`;
  const cur = LESSONS.find(l => l.id === curId);
  $("tocCur").textContent = cur ? cur.num : "";
}

function renderLesson(id) {
  const i = Math.max(0, LESSONS.findIndex(l => l.id === id));
  const l = LESSONS[i];
  const quizHtml = l.quiz.map((q, qi) => `
    <fieldset class="q" style="border:0;padding:0" id="q${qi}">
      <p class="stem"><span>Q${qi + 1}</span>${q.q}</p>
      ${shuffle(q.o.map((o, oi) => oi)).map(oi => `<label class="opt" data-i="${oi}" for="q${qi}o${oi}"><input type="radio" name="q${qi}" id="q${qi}o${oi}" value="${oi}"><span>${q.o[oi]}</span></label>`).join("")}
      <p class="why" hidden></p>
    </fieldset>`).join("");
  $("lesson").innerHTML = `
    <div class="eyebrow">Lesson ${l.num}</div>
    <h1>${l.title}</h1>
    <p class="lede">${l.lede}</p>
    <div class="meta">About ${l.minutes} min reading · ${l.quiz.length}-question quiz${state.done[l.id] ? " · Completed" : ""}</div>
    ${l.body}
    <section class="exercise"><h2>Exercise</h2>${l.exercise}</section>
    <section class="quiz"><h2>Check your understanding</h2>
      <form id="quizForm">${quizHtml}
        <div class="btns"><button type="submit">Check answers</button><button type="button" class="ghost" id="retry" hidden>Try again</button><span class="score" id="score" role="status"></span></div>
      </form>
    </section>
    <section class="deeper"><h2>Go deeper (optional)</h2><p>${l.deeper}</p></section>`;
  const prev = LESSONS[i - 1], next = LESSONS[i + 1];
  $("pager").innerHTML = `<span>${prev ? `<a href="#l-${prev.id}">← ${prev.num} ${prev.title}</a>` : ""}</span><span>${next ? `<a href="#l-${next.id}">${next.num} ${next.title} →</a>` : `<span style="color:var(--muted)">You've reached the end of the course</span>`}</span>`;

  $("quizForm").addEventListener("submit", (e) => {
    e.preventDefault();
    let right = 0;
    l.quiz.forEach((q, qi) => {
      const fs = $("q" + qi);
      const picked = fs.querySelector("input:checked");
      fs.querySelectorAll(".opt").forEach((el) => {
        const oi = +el.dataset.i;
        el.classList.remove("right", "wrong");
        if (oi === q.a) el.classList.add("right");
        else if (picked && +picked.value === oi) el.classList.add("wrong");
      });
      fs.querySelectorAll("input").forEach(inp => inp.disabled = true);
      const why = fs.querySelector(".why");
      why.hidden = false;
      const ok = picked && +picked.value === q.a;
      why.textContent = (ok ? "Correct. " : picked ? "Not quite. " : "No answer picked. ") + q.why;
      if (ok) right++;
    });
    const pct = Math.round(right / l.quiz.length * 100);
    const pass = pct >= 80;
    const sc = $("score");
    sc.className = "score " + (pass ? "pass" : "fail");
    sc.textContent = `${right} of ${l.quiz.length} correct (${pct}%). ` + (pass ? "Lesson marked complete." : "80% marks the lesson complete. Review and try again.");
    if (pass) { state.done[l.id] = true; save(state); renderNav(l.id); }
    e.submitter && (e.submitter.hidden = true);
    $("retry").hidden = false;
  });
  $("retry").addEventListener("click", () => renderLesson(l.id));

  if ($("calc")) {
    const run = () => {
      const P = +$("cStart").value || 0, m = +$("cMonthly").value || 0, r = (+$("cRate").value || 0) / 100 / 12, n = Math.round((+$("cYears").value || 0) * 12);
      const fv = r === 0 ? P + m * n : P * Math.pow(1 + r, n) + m * (Math.pow(1 + r, n) - 1) / r;
      const put = P + m * n;
      $("oEnd").textContent = fmt(fv); $("oIn").textContent = fmt(put); $("oGrowth").textContent = fmt(fv - put);
    };
    ["cStart", "cMonthly", "cRate", "cYears"].forEach(k => $(k).addEventListener("input", run));
    run();
  }
  state.last = l.id; save(state);
  renderNav(l.id);
  if (window.innerWidth <= 860) $("toc").open = false;
}

function route(scroll) {
  const m = location.hash.match(/^#l-(\d+-\d+)$/);
  const id = m && LESSONS.some(l => l.id === m[1]) ? m[1] : (state.last || LESSONS[0].id);
  renderLesson(id);
  if (scroll) window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", () => route(true));
route(false);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
